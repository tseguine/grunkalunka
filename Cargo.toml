[workspace]
members = ["crates/grunkalunka-compiler", "crates/grunkalunka-runtime", "crates/grunkalunka-cli", "crates/grunkalunka-markdown", "crates/grunkalunka-json", "crates/grunkalunka-json-guest", "spikes/003-lossless-string-literals"]
exclude = ["spikes/001-frontend-semantics"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
ryu-js = { version = "=1.0.3", default-features = false }
pulldown-cmark = { version = "=0.13.5", default-features = false }
oxc_allocator = "=0.155.0"
oxc_ast = "=0.155.0"
oxc_parser = "=0.155.0"
oxc_semantic = "=0.155.0"
oxc_span = "=0.155.0"
oxc_syntax = "=0.155.0"
wasmtime = { version = "=50.0.0", default-features = false, features = ["cranelift", "runtime", "std", "anyhow", "component-model"] }
wat = "=1.262.0"

[profile.dev]
debug = false
