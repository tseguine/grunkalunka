<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grunkalunka native block geometry reference slice</title>
<style>
  html, body { margin: 0; padding: 0; }
  #outer { width: 260px; padding: 10px; border: 2px solid black; box-sizing: content-box; }
  #first { width: 100px; height: 24px; margin: 4px 0 0 4px; padding: 6px; border: 3px solid black; box-sizing: content-box; }
  #second { width: 80px; height: 10px; margin: 0; padding: 2px; border: 1px solid black; box-sizing: content-box; }
  /* Additional definite-height boxes; independent of the first three probes. */
  #height-host { width: 120px; height: 80px; margin: 10px 0 0 0; padding: 4px; border: 2px solid black; box-sizing: content-box; }
  #height-first { width: 30px; height: 50%; margin: 3px 0 5px 0; padding: 2px; border: 1px solid black; box-sizing: content-box; }
  #height-second { width: 20px; height: 25%; margin: 0; box-sizing: content-box; }
  /* Separate border-box sizing witness; original hit probes do not overlap. */
  #border-host { width: 120px; height: 80px; margin: 10px 0 0 0; padding: 4px; border: 2px solid black; box-sizing: border-box; }
  #border-first { width: 50%; height: 50%; margin: 3px 0 5px 0; padding: 2px; border: 1px solid black; box-sizing: border-box; }
  #border-second { width: 25%; height: 25%; margin: 0; box-sizing: content-box; }
  /* A document-level scroll witness; no nested overflow contexts. */
  #scroll-spacer { height: 650px; }
  /* Within fixed-height spacer: min > max, border-box, nested percentages. */
  #bounds-containing { width: 400px; height: 80px; }
  #bounds-host { width: 400px; min-width: 45%; max-width: 30%; height: 60px; padding: 4px; border: 2px solid black; box-sizing: border-box; }
  #bounds-first { width: 50%; height: 10px; }
  #bounds-second { width: 250px; max-width: 100px; height: 8px; }
  /* Same definite 80px containing height; contradictory percentage limits. */
  #height-limited { width: 80px; height: 90px; min-height: 75%; max-height: 50%; padding: 4px; border: 2px solid black; box-sizing: border-box; }
  #height-limited-first { width: 30px; height: 50%; }
  #height-limited-second { width: 20px; height: 12px; }
  /* Separate inherited visibility: geometry persists, hit targets change. */
  #visibility-host { width: 40px; height: 25px; margin-left: 300px; visibility: hidden; }
  #visibility-child { width: 14px; height: 6px; visibility: visible; }
  #visibility-inherited { width: 12px; height: 5px; }
  #visibility-sibling { width: 20px; height: 5px; margin-left: 300px; }
  /* A padding-edge paint/hit clip: fixed spacer preserves earlier extents. */
  #clip-parent { width: 20px; height: 12px; margin-left: 100px; border: 2px solid black; padding: 3px; overflow: clip; }
  #clip-child { width: 40px; height: 18px; }
  #clip-sibling { width: 10px; height: 5px; margin-left: 100px; }
  #scroll-target { width: 80px; height: 30px; }
</style>
<div id="outer"><div id="first"></div><div id="second"></div></div>
<div id="height-host"><div id="height-first"></div><div id="height-second"></div></div>
<div id="border-host"><div id="border-first"></div><div id="border-second"></div></div>
<div id="scroll-spacer"><div id="bounds-containing"><div id="bounds-host"><div id="bounds-first"></div><div id="bounds-second"></div></div><div id="height-limited"><div id="height-limited-first"></div><div id="height-limited-second"></div></div></div><div id="visibility-host"><div id="visibility-child"></div><div id="visibility-inherited"></div></div><div id="visibility-sibling"></div><div id="clip-parent"><div id="clip-child"></div></div><div id="clip-sibling"></div></div><div id="scroll-target"></div>
<pre id="output" hidden></pre>
<script>
(() => {
  "use strict";
  const properties = ["display", "boxSizing", "width", "height", "marginTop",
    "paddingLeft", "borderLeftWidth"];
  const observations = ["outer", "first", "second"].map(id => {
    const element = document.getElementById(id);
    const style = getComputedStyle(element);
    const rect = element.getBoundingClientRect();
    return {
      id, text: element.textContent,
      computed: Object.fromEntries(properties.map(key => [key, style[key]])),
      rect: { x: rect.x, y: rect.y, width: rect.width, height: rect.height }
    };
  });
  // A separate measurement of percentage child heights: these are actual
  // DOM rectangles, never computed from the independent Rust sample.
  const heightIds = ["height-host", "height-first", "height-second"];
  const percentageHeights = Object.fromEntries(heightIds.map(id => {
    const rect = document.getElementById(id).getBoundingClientRect();
    return [id, { x: rect.x, y: rect.y, width: rect.width, height: rect.height }];
  }));
  // A third independent rectangle channel covers resolved border-box sizing.
  const borderIds = ["border-host", "border-first", "border-second"];
  const borderBoxes = Object.fromEntries(borderIds.map(id => {
    const rect = document.getElementById(id).getBoundingClientRect();
    return [id, { x: rect.x, y: rect.y, width: rect.width, height: rect.height }];
  }));
  // A width-bound witness lives INSIDE the already fixed-height scroll spacer
  // so it cannot change the existing document-height/scroll target evidence.
  const boundsIds = ["bounds-host", "bounds-first", "bounds-second"];
  const widthBounds = Object.fromEntries(boundsIds.map(id => {
    const rect = document.getElementById(id).getBoundingClientRect();
    return [id, { x: rect.x, y: rect.y, width: rect.width, height: rect.height }];
  }));
  // Independent height-bound witness under the same definite 80px container.
  // The containing box's fixed height protects earlier scroll observations.
  const limitedIds = ["height-limited", "height-limited-first", "height-limited-second"];
  const heightBounds = Object.fromEntries(limitedIds.map(id => {
    const rect = document.getElementById(id).getBoundingClientRect();
    return [id, { x: rect.x, y: rect.y, width: rect.width, height: rect.height }];
  }));
  // getBoundingClientRect synchronously flushes layout after each style change.
  // Record the hidden and restored states separately from the initial capture;
  // none of these measurements infer the engine's CSS implementation.
  const ids = ["outer", "first", "second"];
  function boxes() {
    return Object.fromEntries(ids.map(id => {
      const element = document.getElementById(id);
      if (getComputedStyle(element).display === "none") return [id, null];
      const rect = element.getBoundingClientRect();
      return [id, { x: rect.x, y: rect.y, width: rect.width, height: rect.height }];
    }));
  }
  // An independent DOM hit-test probe for selected untransformed rectangles.
  // Its result is an actual element ID, not inferred from the captured boxes.
  const probes = [
    ["first-center", 20, 20],
    ["first-lower", 20, 34],
    ["second-original", 20, 60],
    ["left-margin", 13, 14],
    ["outer-border", 5, 5],
    ["outside", 300, 20],
    ["first-right", 133, 20]
  ];
  function hitTargets() {
    return Object.fromEntries(probes.map(([name, x, y]) => {
      const element = document.elementFromPoint(x, y);
      return [name, ids.includes(element?.id) ? element.id : null];
    }));
  }
  const originalTargets = hitTargets();
  const first = document.getElementById("first");
  first.style.display = "none";
  const hidden = boxes();
  const hiddenTargets = hitTargets();
  first.style.removeProperty("display");
  const restored = boxes();
  const restoredTargets = hitTargets();
  // A real visibility toggle must not change boxes or document flow. These
  // source-side computed values and elementFromPoint observations are measured,
  // not inferred from the separate Rust model.
  const visibilityIds = ["visibility-host", "visibility-child",
    "visibility-inherited", "visibility-sibling"];
  const visibilityPoints = [
    ["child", 301, 359],
    ["host", 318, 360],
    ["inherited", 301, 366],
    ["sibling", 301, 385]
  ];
  function visibilitySample() {
    return {
      boxes: Object.fromEntries(visibilityIds.map(id => {
        const rect = document.getElementById(id).getBoundingClientRect();
        return [id, { x: rect.x, y: rect.y, width: rect.width, height: rect.height }];
      })),
      computed: Object.fromEntries(visibilityIds.map(id =>
        [id, getComputedStyle(document.getElementById(id)).visibility === "visible"])),
      hits: Object.fromEntries(visibilityPoints.map(([name, x, y]) => {
        const element = document.elementFromPoint(x, y);
        return [name, visibilityIds.includes(element?.id) ? element.id : null];
      }))
    };
  }
  const visibilityHost = document.getElementById("visibility-host");
  const visibilityHidden = visibilitySample();
  visibilityHost.style.visibility = "visible";
  const visibilityVisible = visibilitySample();
  visibilityHost.style.removeProperty("visibility");
  const visibilityRestored = visibilitySample();
  const visibilityStates = {
    hidden: visibilityHidden, visible: visibilityVisible, restored: visibilityRestored
  };
  // A separate source-measured padding-box clipping channel. Keep
  // all earlier geometry, visibility and hit probes independent of this group.
  const clipIds = ["clip-parent", "clip-child", "clip-sibling"];
  const clipProbes = [
    ["inside", 106, 395],
    ["padding-edge", 127, 395],
    ["border-edge", 128, 395],
    ["outside-parent", 135, 395],
    ["bottom-border", 106, 409],
    ["sibling", 105, 412],
    ["parent-border", 101, 389]
  ];
  function clipSample() {
    return {
      mode: getComputedStyle(document.getElementById("clip-parent")).overflowX,
      boxes: Object.fromEntries(clipIds.map(id => {
        const rect = document.getElementById(id).getBoundingClientRect();
        return [id, { x: rect.x, y: rect.y, width: rect.width, height: rect.height }];
      })),
      hits: Object.fromEntries(clipProbes.map(([name, x, y]) => {
        const element = document.elementFromPoint(x, y);
        return [name, clipIds.includes(element?.id) ? element.id : null];
      }))
    };
  }
  const clipParent = document.getElementById("clip-parent");
  const clipOriginal = clipSample();
  clipParent.style.overflow = "visible";
  const clipVisible = clipSample();
  clipParent.style.removeProperty("overflow");
  const clipRestored = clipSample();
  const clipStates = {
    clipped: clipOriginal, visible: clipVisible, restored: clipRestored
  };
  // Observe a real page-level scroll, not a synthetic coordinate subtraction.
  // All earlier geometry/hit channels were captured before changing scrollY.
  function scrollSample() {
    const rect = document.getElementById("scroll-target").getBoundingClientRect();
    const hit = document.elementFromPoint(10, 590);
    return {
      scrollX: window.scrollX, scrollY: window.scrollY,
      targetRect: { x: rect.x, y: rect.y, width: rect.width, height: rect.height },
      hitTarget: hit?.id === "scroll-target" ? "scroll-target" : null
    };
  }
  const scrollBefore = scrollSample();
  window.scrollTo(0, 350);
  const scrollDuring = scrollSample();
  window.scrollTo(0, 0);
  const scrollRestored = scrollSample();
  const scrollViewport = {
    documentHeight: document.scrollingElement.scrollHeight,
    before: scrollBefore, scrolled: scrollDuring, restored: scrollRestored
  };
  document.getElementById("output").textContent = JSON.stringify({
    schemaVersion: 1,
    fixtureId: "native-block-bridge-v1",
    environment: {
      userAgent: navigator.userAgent, viewportWidth: window.innerWidth,
      viewportHeight: window.innerHeight, devicePixelRatio: window.devicePixelRatio,
      url: location.href, timestamp: new Date().toISOString()
    },
    observations,
    percentageHeights,
    borderBoxes,
    widthBounds,
    heightBounds,
    visibilityStates,
    clipStates,
    scrollViewport,
    reflow: { hidden, restored },
    hitTargets: {
      original: originalTargets, hidden: hiddenTargets, restored: restoredTargets
    }
  });
})();
</script>
</html>
