<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Native fixed-size flex row, alignment and overlap reference observations</title>
<style>
  html, body { margin: 0; padding: 0; }
  html { scroll-behavior: auto; }
  body { display: flow-root; min-height: 1200px; }
  * { box-sizing: content-box; }
  #row-host {
    display: flex;
    flex-flow: row nowrap;
    align-items: flex-start;
    align-content: flex-start;
    justify-content: flex-start;
    width: 150px;
    margin: 20px 0 0 20px;
    padding: 4px;
    border: 2px solid black;
    column-gap: 10px;
    row-gap: 8px;
  }
  #row-a, #row-b, #row-c { flex: none; min-width: 0; }
  #row-a { width: 60px; height: 20px; padding: 1px; border: 1px solid black; }
  #row-contents { display: contents; width: 999px; padding: 100px; border: 50px solid red; }
  #row-b {
    width: 50px;
    height: 30px;
    padding: 2px;
    border: 1px solid black;
    margin: 2px 3px 4px 5px;
  }
  #row-inner { width: 50%; height: 8px; }
  #row-c { width: 40px; height: 16px; border: 1px solid black; }
  #row-after { width: 180px; height: 12px; margin-top: 6px; }
  #output { display: none; }
</style>
<body>
<div id="row-host"><div id="row-a"></div><div id="row-contents"><div id="row-b"><div id="row-inner"></div></div><div id="row-c"></div></div></div>
<div id="row-after"></div>
<pre id="output"></pre>
<script>
(() => {
  "use strict";
  // Measurements come only from the browser. No expected/native geometry is
  // embedded in this fixture, including during source mutation controls.
  const ids = ["row-host", "row-a", "row-b", "row-inner", "row-c", "row-after"];
  const probes = [
    ["a", 30, 30], ["b", 110, 32], ["nowrap", 180, 30],
    ["wrap", 30, 80], ["gap-wrap", 118, 62], ["after", 10, 110],
    ["host-border", 21, 21], ["gap", 95, 30], ["outside", 250, 50]
  ];
  const computedFields = ["display", "boxSizing", "width", "height", "flexDirection",
    "flexWrap", "alignItems", "alignContent", "justifyContent", "columnGap", "rowGap",
    "flexGrow", "flexShrink", "flexBasis", "minWidth"];
  const host = document.getElementById("row-host");
  const a = document.getElementById("row-a");
  const b = document.getElementById("row-b");
  const c = document.getElementById("row-c");
  const contents = document.getElementById("row-contents");
  const after = document.getElementById("row-after");
  const inner = document.getElementById("row-inner");

  function box(element) {
    // getClientRects detects suppressed descendants as well as display:none
    // on the element itself. A missing box is explicit null, not a zero rect.
    if (element.getClientRects().length === 0) return null;
    const rect = element.getBoundingClientRect();
    return { x: rect.x + window.scrollX, y: rect.y + window.scrollY,
      width: rect.width, height: rect.height };
  }

  function sample() {
    return {
      scrollY: window.scrollY,
      boxes: Object.fromEntries(ids.map(id => [id, box(document.getElementById(id))])),
      hits: Object.fromEntries(probes.map(([name, x, y]) => {
        const element = document.elementFromPoint(x, y);
        return [name, ids.includes(element?.id) ? element.id : null];
      }))
    };
  }

  function reset(wrap = false) {
    host.removeAttribute("style");
    a.removeAttribute("style");
    b.removeAttribute("style");
    c.removeAttribute("style");
    contents.removeAttribute("style");
    after.removeAttribute("style");
    inner.removeAttribute("style");
    if (wrap) host.style.flexWrap = "wrap";
    window.scrollTo(0, 0);
  }

  reset();
  const states = { nowrap: sample() };
  const observations = ids.map(id => {
    const element = document.getElementById(id);
    const computed = getComputedStyle(element);
    return {
      id, text: element.textContent,
      computed: Object.fromEntries(computedFields.map(field => [field, computed[field]])),
      rect: box(element)
    };
  });

  reset(true);
  states.wrap = sample();
  reset(true);
  host.style.width = "220px";
  states.wide = sample();
  reset(true);
  host.style.columnGap = "24px";
  states.columnGap = sample();
  reset(true);
  host.style.rowGap = "18px";
  states.rowGap = sample();
  reset(true);
  b.style.display = "none";
  states.hidden = sample();
  reset(true);
  b.style.position = "relative";
  b.style.left = "8px";
  b.style.top = "9px";
  states.relative = sample();
  reset(true);
  host.style.height = "36px";
  host.style.overflow = "clip";
  states.clipped = sample();
  reset(true);
  window.scrollTo(0, 10);
  states.scrolled = sample();

  reset();
  host.style.width = "220px";
  host.style.justifyContent = "safe flex-end";
  states.justifyEnd = sample();
  reset();
  host.style.width = "220px";
  host.style.justifyContent = "safe center";
  states.justifyCenter = sample();
  reset();
  host.style.width = "230px";
  host.style.justifyContent = "space-between";
  states.spaceBetween = sample();
  reset();
  host.style.width = "220px";
  host.style.height = "60px";
  host.style.alignItems = "safe flex-end";
  states.alignEnd = sample();
  reset();
  host.style.width = "220px";
  host.style.height = "60px";
  host.style.alignItems = "safe center";
  states.alignCenter = sample();
  reset(true);
  host.style.justifyContent = "space-between";
  host.style.alignItems = "safe center";
  states.wrapAlign = sample();
  reset(true);
  host.style.width = "220px";
  host.style.height = "60px";
  host.style.alignItems = "safe flex-end";
  states.wrapSingle = sample();
  reset();
  host.style.height = "20px";
  host.style.justifyContent = "safe flex-end";
  host.style.alignItems = "safe flex-end";
  after.style.position = "static";
  states.safeOverflow = sample();
  reset();
  host.style.height = "20px";
  host.style.justifyContent = "safe flex-end";
  host.style.alignItems = "safe flex-end";
  host.style.overflow = "clip";
  states.overlapClipped = sample();
  reset();
  b.style.display = "flex";
  b.style.alignItems = "flex-start";
  b.style.marginTop = "0px";
  inner.style.flex = "none";
  inner.style.minWidth = "0px";
  inner.style.width = "100px";
  inner.style.height = "8px";
  states.nestedOverlap = sample();
  reset();
  host.style.height = "20px";
  host.style.justifyContent = "safe flex-end";
  host.style.alignItems = "safe flex-end";
  b.style.display = "flex";
  b.style.alignItems = "flex-start";
  inner.style.flex = "none";
  inner.style.minWidth = "0px";
  inner.style.width = "100px";
  inner.style.height = "40px";
  states.nestedOverflow = sample();
  reset();
  host.style.width = "220px";
  host.style.height = "60px";
  host.style.justifyContent = "safe center";
  host.style.alignItems = "safe center";
  b.style.position = "relative";
  b.style.left = "8px";
  b.style.top = "9px";
  states.relativeAlign = sample();
  reset();
  host.style.width = "216px";
  host.style.height = "28px";
  host.style.justifyContent = "safe center";
  host.style.alignItems = "safe flex-end";
  host.style.overflow = "clip";
  states.clippedAlign = sample();
  reset();
  host.style.width = "220px";
  host.style.height = "60px";
  host.style.alignItems = "safe center";
  window.scrollTo(0, 10);
  states.scrolledAlign = sample();
  reset();
  host.style.width = "220px";
  host.style.height = "60px";
  host.style.alignItems = "safe center";
  a.style.alignSelf = "flex-start";
  contents.style.alignSelf = "safe flex-end";
  contents.style.alignItems = "flex-start";
  inner.style.alignSelf = "safe flex-end";
  b.style.alignSelf = "safe flex-end";
  states.selfAlignMixed = sample();
  reset();
  host.style.width = "220px";
  host.style.height = "60px";
  host.style.alignItems = "safe center";
  a.style.alignSelf = "flex-start";
  contents.style.alignSelf = "safe flex-end";
  contents.style.alignItems = "flex-start";
  inner.style.alignSelf = "safe flex-end";
  b.style.alignSelf = "safe flex-end";
  b.style.alignSelf = "auto";
  states.selfAlignAuto = sample();
  reset(true);
  host.style.width = "220px";
  host.style.height = "60px";
  host.style.alignItems = "safe center";
  a.style.alignSelf = "safe flex-end";
  contents.style.alignSelf = "safe flex-end";
  c.style.alignSelf = "flex-start";
  states.selfAlignWrap = sample();
  reset();
  host.style.width = "220px";
  host.style.height = "20px";
  a.style.alignSelf = "safe center";
  b.style.alignSelf = "safe flex-end";
  c.style.alignSelf = "safe center";
  states.selfAlignOverflow = sample();
  reset();
  host.style.width = "220px";
  host.style.height = "36px";
  host.style.overflow = "clip";
  a.style.alignSelf = "safe flex-end";
  b.style.alignSelf = "safe center";
  b.style.position = "relative";
  b.style.top = "15px";
  c.style.alignSelf = "safe center";
  states.selfAlignClipped = sample();
  window.scrollTo(0, 10);
  states.selfAlignScrolled = sample();
  reset(true);
  host.style.height = "100px";
  host.style.alignItems = "safe center";
  host.style.alignContent = "safe flex-end";
  states.contentEnd = sample();
  reset(true);
  host.style.height = "100px";
  host.style.alignItems = "safe center";
  host.style.alignContent = "safe center";
  states.contentCenter = sample();
  reset(true);
  host.style.width = "100px";
  host.style.height = "140px";
  host.style.alignContent = "space-between";
  states.contentBetween = sample();
  reset(true);
  host.style.width = "100px";
  host.style.height = "160px";
  host.style.alignContent = "space-around";
  states.contentAround = sample();
  reset(true);
  host.style.width = "100px";
  host.style.height = "140px";
  host.style.alignContent = "space-evenly";
  states.contentEvenly = sample();
  reset(true);
  host.style.width = "220px";
  host.style.height = "60px";
  host.style.alignItems = "safe center";
  host.style.alignContent = "safe flex-end";
  states.contentSingle = sample();
  reset();
  host.style.width = "220px";
  host.style.height = "60px";
  host.style.alignItems = "safe center";
  host.style.alignContent = "safe flex-end";
  states.contentNoWrap = sample();
  reset(true);
  host.style.height = "41px";
  host.style.alignItems = "safe center";
  host.style.alignContent = "safe center";
  states.contentOverflow = sample();
  reset(true);
  host.style.height = "100px";
  host.style.alignItems = "safe center";
  host.style.alignContent = "space-between";
  host.style.overflow = "clip";
  c.style.position = "relative";
  c.style.top = "15px";
  states.contentClipped = sample();
  window.scrollTo(0, 60);
  states.contentScrolled = sample();
  reset();
  states.restored = sample();

  document.getElementById("output").textContent = JSON.stringify({
    schemaVersion: 1,
    fixtureId: "native-flex-bridge-v1",
    environment: {
      userAgent: navigator.userAgent, viewportWidth: window.innerWidth,
      viewportHeight: window.innerHeight, devicePixelRatio: window.devicePixelRatio,
      url: location.href, timestamp: new Date().toISOString()
    },
    observations,
    states
  });
})();
</script>
</body>
</html>
