<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Grunkalunka cascade and DOM mutation oracle</title>
<style>
  html, body { margin: 0; padding: 0; }
  #target { display: block; box-sizing: content-box; width: 80px; height: 10px; padding: 2px; border: 1px solid black; margin: 0; }
  .box.selected { width: 52px !important; }
  .box { width: 24px !important; }
  .box { width: 40px !important; }
</style>
<div id="target" class="box"></div>
<pre id="output" hidden></pre>
<script>
(() => {
  "use strict";
  const target = document.getElementById("target");
  const observations = [];
  function observe(id) {
    const style = getComputedStyle(target);
    const rect = target.getBoundingClientRect();
    const computed = {};
    for (const key of ["display", "boxSizing", "width", "height", "paddingLeft",
      "paddingRight", "paddingTop", "paddingBottom", "borderLeftWidth",
      "borderRightWidth", "borderTopWidth", "borderBottomWidth"]) computed[key] = style[key];
    observations.push({ id, text: target.textContent, computed,
      rect: { x: rect.x, y: rect.y, width: rect.width, height: rect.height },
      dom: { className: target.className, inlineWidth: target.style.getPropertyValue("width"),
        inlinePriority: target.style.getPropertyPriority("width") } });
  }
  observe("initial");
  target.style.setProperty("width", "100px");
  observe("normal-inline");
  target.style.setProperty("width", "64px", "important");
  observe("important-inline");
  target.style.removeProperty("width");
  observe("remove-inline");
  target.classList.add("selected");
  observe("selected-class");
  target.classList.remove("selected");
  observe("remove-selected");
  target.classList.remove("box");
  observe("remove-box");
  target.classList.add("box");
  observe("restore-box");
  document.getElementById("output").textContent = JSON.stringify({
    schemaVersion: 1, fixtureId: "cascade-mutations-v1",
    environment: { userAgent: navigator.userAgent, viewportWidth: window.innerWidth,
      viewportHeight: window.innerHeight, devicePixelRatio: window.devicePixelRatio,
      url: location.href, timestamp: new Date().toISOString() },
    observations
  });
})();
</script>
</html>
