<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Grunkalunka original flex multi-line oracle</title>
<style>
  html, body { margin: 0; padding: 0; }
  #row { display: flex; flex-direction: row; flex-wrap: nowrap; width: 150px; height: 120px;
    column-gap: 10px; row-gap: 10px; align-content: flex-start; align-items: flex-start;
    padding: 0; margin: 0; border: 0; }
  #alpha, #beta, #gamma { flex: 0 0 60px; height: 20px; min-width: 0;
    padding: 0; margin: 0; border: 0; }
</style>
<div id="row"><div id="alpha"></div><div id="beta"></div><div id="gamma"></div></div>
<pre id="output" hidden></pre>
<script>
(() => {
  "use strict";
  const row = document.getElementById("row");
  const items = ["alpha", "beta", "gamma"].map(id => document.getElementById(id));
  const beta = items[1], observations = [];
  function observe(id) {
    const style = getComputedStyle(row), rect = row.getBoundingClientRect();
    observations.push({ id, container: {
      computed: { display: style.display, width: style.width, height: style.height,
        flexDirection: style.flexDirection, flexWrap: style.flexWrap,
        alignContent: style.alignContent, alignItems: style.alignItems,
        columnGap: style.columnGap, rowGap: style.rowGap },
      inlineWrap: row.style.flexWrap, inlineColumnGap: row.style.columnGap,
      inlineRowGap: row.style.rowGap,
      rect: { x: rect.x, y: rect.y, width: rect.width, height: rect.height }
    }, items: items.map(node => {
      const computed = getComputedStyle(node), box = node.getBoundingClientRect();
      return { id: node.id, text: node.textContent,
        computed: { display: computed.display, width: computed.width, height: computed.height,
          flexGrow: computed.flexGrow, flexShrink: computed.flexShrink,
          flexBasis: computed.flexBasis }, inlineBasis: node.style.flexBasis,
        rect: { x: box.x, y: box.y, width: box.width, height: box.height } };
    }) });
  }
  observe("initial-nowrap");
  row.style.setProperty("flex-wrap", "wrap");
  observe("enable-wrap");
  beta.style.setProperty("flex-basis", "90px");
  observe("widen-beta");
  beta.style.removeProperty("flex-basis");
  observe("restore-beta");
  row.style.setProperty("column-gap", "40px");
  observe("increase-column-gap");
  row.style.setProperty("row-gap", "25px");
  observe("increase-row-gap");
  row.style.setProperty("column-gap", "10px");
  observe("restore-column-gap");
  row.style.setProperty("flex-wrap", "nowrap");
  observe("disable-wrap");
  row.style.setProperty("flex-wrap", "wrap");
  observe("restore-wrap");
  document.getElementById("output").textContent = JSON.stringify({
    schemaVersion: 1, fixtureId: "flex-wrap-lines-v1", observationKind: "flex-wrap-lines",
    environment: { userAgent: navigator.userAgent, viewportWidth: innerWidth,
      viewportHeight: innerHeight, devicePixelRatio, url: location.href,
      timestamp: new Date().toISOString() }, observations
  });
})();
</script>
</html>
