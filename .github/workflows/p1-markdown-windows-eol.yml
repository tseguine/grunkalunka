# P1 diagnostic: compare the same temporary Windows checkout with Git CRLF vs LF.
name: P1 Windows Markdown CRLF checkout comparison

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/p1-markdown-windows-eol.yml
      - tools/bench/windows-eol-markdown.mjs
      - tools/bench/tests/windows-eol-markdown.test.mjs
      - crates/grunkalunka-markdown/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-windows-markdown-eol-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  windows-eol:
    name: Build Markdown guest from CRLF then LF in same Windows path
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out tested revision, not a user workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native Node.js 24.21.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          architecture: x64
          package-manager-cache: false

      - name: Verify native Windows and install the matching Rust target
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Windows
          test "$RUNNER_ARCH" = X64
          node -e "if (process.platform !== 'win32' || process.arch !== 'x64' || process.version !== 'v24.21.0') process.exit(1)"
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f 1)"
          rustup toolchain install "$toolchain" --profile minimal --target wasm32-unknown-unknown
          rustc -vV | tee "$RUNNER_TEMP/rustc.txt"
          grep -F "host: x86_64-pc-windows-msvc" "$RUNNER_TEMP/rustc.txt"
          cargo fetch --locked

      - name: Test pure comparison and rejection behavior
        run: node --test tools/bench/tests/windows-eol-markdown.test.mjs

      - name: Rebuild unchanged Rust guest using only disposable Git checkout
        run: |
          set -euo pipefail
          node tools/bench/windows-eol-markdown.mjs > "$RUNNER_TEMP/windows-eol-report.json"
          node --input-type=commonjs - "$RUNNER_TEMP/windows-eol-report.json" <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          assert.equal(report.schemaVersion, 1);
          assert.equal(report.workload, 'p1-windows-markdown-checkout-eol');
          assert.deepEqual([report.environment.os, report.environment.arch],
            ['win32', 'x64']);
          assert.equal(report.environment.rustcHost, 'x86_64-pc-windows-msvc');
          assert.equal(report.environment.target, 'wasm32-unknown-unknown');
          assert.equal(report.environment.node, 'v24.21.0');
          assert.equal(report.crlf.artifact.phase, 'CRLF');
          assert.equal(report.lf.artifact.phase, 'LF');
          assert.ok(report.comparison.crlfModifiedPaths.length > 0);
          assert.deepEqual(report.comparison.lfModifiedPaths, []);
          assert.equal(typeof report.comparison.emittedWasmIdentical, 'boolean');
          // Do not turn the very difference we are investigating into a failed gate.
          console.log('PASS controlled Git checkout EOL comparison');
          console.log(JSON.stringify(report));
          NODE
