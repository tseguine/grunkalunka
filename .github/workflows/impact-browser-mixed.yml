name: PR impact mixed browser and layout rehearsal

on:
  pull_request:
    branches: [master]
    paths:
      - 'ci/impact/browser-mixed.mjs'
      - 'ci/impact/browser-mixed.test.mjs'
      - 'ci/impact/run-browser-mixed.mjs'
      - '.github/workflows/impact-browser-mixed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearsal:
    name: Advisory browser/layout scoped checks (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install Rust format and Clippy
        run: |
          node -e 'require("node:assert/strict").equal(process.version, "v24.21.0")'
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f 1)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustc -vV
      - name: Restore optional Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: impact-browser-mixed-linux
          workspaces: |
            . -> target
          cache-bin: 'false'
          save-if: 'false'
      - name: Prepare locked offline Cargo inputs
        run: cargo fetch --locked
      - name: Check mixed browser/CI fallback and scope contracts
        run: node --test ci/impact/browser-mixed.test.mjs
      - name: Run actual scoped layout and offline browser contracts
        env:
          CARGO_INCREMENTAL: '0'
          RUST_BACKTRACE: '1'
        run: node ci/impact/run-browser-mixed.mjs
