name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, ci/nextest-eval-1113]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel outdated PR heads, but finish already-running master builds.
  # Default queue: single replaces older pending runs with the latest commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  checks:
    if: github.event_name == 'pull_request'
    name: Checks (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    # Keep the existing bounded selective PR gate.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
          - platform: Windows
            runner: windows-2025
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Each PR runner needs merge-base history for independent impact planning.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Exact patch version on every host for reproducibility.
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Install the repository Rust toolchain and Wasm target
        run: |
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f 1)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustc --version --verbose
          cargo --version
          node --version
          node -e 'require("node:assert/strict").equal(process.version, "v24.21.0")'

      - name: Check formatting before expensive builds
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path spikes/001-frontend-semantics/Cargo.toml --check

      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.runner }}
          workspaces: |
            . -> target
            spikes/001-frontend-semantics -> target
          cache-bin: 'false'
          # PRs reuse base-branch caches without creating a cache per PR.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      - name: Fetch locked dependencies for both workspaces
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path spikes/001-frontend-semantics/Cargo.toml

      # Linux/Windows PRs use the same dependency graph, not a path allowlist.
      # Unknown/unsafe plans run the complete fast PR profile on that host.
      # Disable all-platform selective PR verification with PARTIAL_PR_CI='false'.
      - name: Verify PR (selected or complete fast profile)
        if: github.event_name == 'pull_request'
        env:
          PARTIAL_PR_CI: 'true'
        run: node ci/impact/pr-gate.mjs

  full-checks:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    name: Full ${{ matrix.group }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    # Each independent full group retains the original 90-minute watchdog.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: [Linux, Windows]
        group: [rust-tests, style, applications, remaining]
        include:
          - platform: Linux
            runner: ubuntu-24.04
          - platform: Windows
            runner: windows-2025
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Each PR runner needs merge-base history for independent impact planning.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Exact patch version on every host for reproducibility.
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Install the repository Rust toolchain and Wasm target
        run: |
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f 1)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustc --version --verbose
          cargo --version
          node --version
          node -e 'require("node:assert/strict").equal(process.version, "v24.21.0")'

      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.runner }}
          workspaces: |
            . -> target
            spikes/001-frontend-semantics -> target
          cache-bin: 'false'
          # PRs reuse base-branch caches without creating a cache per PR.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.group == 'rust-tests' }}

      - name: Fetch locked dependencies for both workspaces
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path spikes/001-frontend-semantics/Cargo.toml

      - name: Build the workspace offline (full verification)
        run: cargo build --workspace --locked --offline -j 4

      - name: Run the canonical group (full verification)
        run: node scripts/check.mjs --master-group=${{ matrix.group }}


  # One-time benchmark on the dedicated branch; master/PR checks are unchanged.
  nextest-evaluation:
    name: Nextest A/B (${{ matrix.platform }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/ci/nextest-eval-1113'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
          - platform: Windows
            runner: windows-2025
    steps:
      - name: Check out the benchmark revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Set up Rust and Wasm
        run: |
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f 1)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --target wasm32-unknown-unknown
          cargo --version

      - name: Restore dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.runner }}
          workspaces: |
            . -> target
            spikes/001-frontend-semantics -> target
          cache-bin: 'false'
          save-if: 'false'

      - name: Fetch and compile exact workspace test binaries
        run: |
          cargo fetch --locked
          cargo build --workspace --locked --offline -j 4
          cargo test --workspace --bins --lib --tests --examples --locked --offline -j 4 --no-run

      - name: Install pinned Nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest@0.9.149
          fallback: none

      - name: Measure Cargo test execution (no doctests)
        run: |
          start=$SECONDS
          cargo test --workspace --bins --lib --tests --examples --locked --offline -j 4 --no-fail-fast
          echo "MEASURE CARGO_TEST_BINARIES_SECONDS=$((SECONDS - start))" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Measure Nextest execution (same target classes)
        run: |
          start=$SECONDS
          cargo nextest run --workspace --bins --lib --tests --examples --locked --offline -j 4 --no-fail-fast --test-threads 2
          echo "MEASURE NEXTEST_BINARIES_SECONDS=$((SECONDS - start))" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run doctests separately (not supported by Nextest)
        run: |
          start=$SECONDS
          cargo test --workspace --doc --locked --offline -j 4 --no-fail-fast
          echo "MEASURE CARGO_DOCTEST_SECONDS=$((SECONDS - start))" | tee -a "$GITHUB_STEP_SUMMARY"

  macos-probe:
    name: macOS baseline lookup (Linux)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    outputs:
      fresh: ${{ steps.lookup.outputs.fresh }}
    steps:
      - name: Check out reference-check script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Decide whether native macOS fallback is required
        id: lookup
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node ci/macos-baseline.mjs

  macos-fallback:
    name: Native macOS fallback (only if baseline unhealthy)
    needs: macos-probe
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.macos-probe.result != 'success' || needs.macos-probe.outputs.fresh != 'true') }}
    uses: ./.github/workflows/macos.yml
    with:
      pr-checks: true
    permissions:
      contents: read

  macos-verification:
    name: macOS verification (baseline or native fallback)
    needs: [macos-probe, macos-fallback]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify healthy baseline or successful native fallback
        env:
          PROBE_RESULT: ${{ needs.macos-probe.result }}
          BASELINE_FRESH: ${{ needs.macos-probe.outputs.fresh }}
          FALLBACK_RESULT: ${{ needs.macos-fallback.result }}
        run: |
          if [[ "$PROBE_RESULT" == success && "$BASELINE_FRESH" == true ]]; then
            echo 'PASS: recent completed native macOS baseline; this PR was not run on macOS' | tee -a "$GITHUB_STEP_SUMMARY"
          elif [[ "$FALLBACK_RESULT" == success ]]; then
            echo 'PASS: real native macOS fallback completed for this PR merge revision' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "FAIL: macOS baseline unhealthy and native fallback was not successful ($FALLBACK_RESULT)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
