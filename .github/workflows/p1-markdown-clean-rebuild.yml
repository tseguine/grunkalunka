# Optional P1 reproducibility diagnostic; full canonical CI is unchanged.
name: P1 Markdown same-host clean rebuild

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/p1-markdown-clean-rebuild.yml
      - tools/bench/markdown-clean-rebuild.mjs
      - tools/bench/tests/markdown-clean-rebuild.test.mjs
      - crates/grunkalunka-markdown/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-markdown-clean-rebuild-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  clean-rebuild:
    name: Two fresh Markdown Wasm builds on ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x64
            runner: ubuntu-24.04
            os: Linux
            runner_arch: X64
            js_os: linux
            js_arch: x64
            rust_host: x86_64-unknown-linux-gnu
          - platform: Windows x64
            runner: windows-2025
            os: Windows
            runner_arch: X64
            js_os: win32
            js_arch: x64
            rust_host: x86_64-pc-windows-msvc
          - platform: Apple Silicon macOS ARM64
            runner: macos-15
            os: macOS
            runner_arch: ARM64
            js_os: darwin
            js_arch: arm64
            rust_host: aarch64-apple-darwin
    steps:
      - name: Check out exact tested source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install matching native Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          architecture: ${{ matrix.js_arch }}
          package-manager-cache: false

      - name: Verify native host and install Rust Wasm target
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
          EXPECTED_JS_OS: ${{ matrix.js_os }}
          EXPECTED_JS_ARCH: ${{ matrix.js_arch }}
          EXPECTED_RUST_HOST: ${{ matrix.rust_host }}
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = "$EXPECTED_OS"
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"
          node -e "if (process.platform !== process.env.EXPECTED_JS_OS || process.arch !== process.env.EXPECTED_JS_ARCH || process.version !== 'v24.21.0') process.exit(1)"
          if [ "$RUNNER_OS" = macOS ]; then
            test "$(uname -m)" = arm64
            test "$(sysctl -n sysctl.proc_translated 2>/dev/null || printf '0')" = 0
          fi
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f 1)"
          rustup toolchain install "$toolchain" --profile minimal --target wasm32-unknown-unknown
          rustc -vV | tee "$RUNNER_TEMP/rustc-host.txt"
          grep -F "host: $EXPECTED_RUST_HOST" "$RUNNER_TEMP/rustc-host.txt"
          cargo --version
          cargo fetch --locked

      - name: Run pure mismatch/validation regression tests
        run: node --test tools/bench/tests/markdown-clean-rebuild.test.mjs

      - name: Build twice from clean Wasm target and inspect reproducibility
        env:
          EXPECTED_JS_OS: ${{ matrix.js_os }}
          EXPECTED_JS_ARCH: ${{ matrix.js_arch }}
          EXPECTED_RUST_HOST: ${{ matrix.rust_host }}
        run: |
          set -euo pipefail
          node tools/bench/markdown-clean-rebuild.mjs > "$RUNNER_TEMP/rebuild-report.json"
          node --input-type=commonjs - "$RUNNER_TEMP/rebuild-report.json" <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          assert.equal(report.schemaVersion, 1);
          assert.equal(report.workload, 'p1-markdown-guest-same-host-rebuild');
          assert.equal(report.environment.os, process.env.EXPECTED_JS_OS);
          assert.equal(report.environment.arch, process.env.EXPECTED_JS_ARCH);
          assert.equal(report.environment.rustcHost, process.env.EXPECTED_RUST_HOST);
          assert.equal(report.environment.target, 'wasm32-unknown-unknown');
          assert.equal(report.environment.cargoIncremental, '0');
          assert.deepEqual(report.observations.map(o => o.phase),
            ['first-clean', 'unchanged-invocation', 'second-clean']);
          assert.equal(report.inputs.length, 6);
          assert.equal(typeof report.comparison.unchangedInvocationEqual, 'boolean');
          assert.equal(typeof report.comparison.cleanBuildsEqual, 'boolean');
          assert.match(report.observations[0].sha256, /^[a-f0-9]{64}$/);
          // The result is diagnostic: a differing rebuilt artifact is evidence,
          // not a test failure to hide. Invalid input/builds still fail closed.
          console.log('PASS P1 same-host Markdown guest reproducibility observation');
          console.log(JSON.stringify(report));
          NODE
