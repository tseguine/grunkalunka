# P1: compare independent native compiler outputs, not transferred-artifact execution.
name: P1 native GCD Wasm output identity

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/p1-native-gcd-identity.yml
      - tools/bench/native-build-identity.mjs
      - tests/build/native-build-identity.test.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-native-gcd-identity-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  produce-linux:
    name: Independently compile GCD on Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      wasm64: ${{ steps.transfer.outputs.wasm64 }}
      wasm_sha256: ${{ steps.transfer.outputs.wasm_sha256 }}
      source_sha256: ${{ steps.transfer.outputs.source_sha256 }}
    steps:
      - name: Check out exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use native Node.js 24.22.1 on x64
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          architecture: x64
          package-manager-cache: false

      - name: Validate native Linux host and build existing Rust CLI
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
          node -e "if (process.platform !== 'linux' || process.arch !== 'x64' || process.version !== 'v24.22.1') process.exit(1)"
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f 1)"
          rustup toolchain install "$toolchain" --profile minimal
          rustc -vV
          cargo fetch --locked
          cargo build --locked --offline -p grunkalunka-cli -j 4

      - name: Check independent-identity validation failures
        run: node --test tests/build/native-build-identity.test.mjs

      - name: Build canonical Git source and check both Wasm engines
        run: |
          set -euo pipefail
          node tools/bench/native-build-identity.mjs produce ./target/debug/grunkalunka \
            > "$RUNNER_TEMP/native-build-receipt.json"

      - name: Transfer bounded producer identities and actual Wasm bytes
        id: transfer
        run: |
          set -euo pipefail
          node --input-type=commonjs - "$RUNNER_TEMP/native-build-receipt.json" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const { createHash } = require('node:crypto');
          const [reportFile, outputFile] = process.argv.slice(2);
          const receipt = JSON.parse(fs.readFileSync(reportFile, 'utf8'));
          assert.equal(receipt.schemaVersion, 1);
          assert.equal(receipt.workload, 'p1-native-gcd-output-identity');
          assert.equal(receipt.mode, 'produce');
          assert.equal(receipt.host.os, 'linux');
          assert.equal(receipt.host.arch, 'x64');
          assert.equal(receipt.host.node, 'v24.22.1');
          assert.equal(receipt.node.goldenCases, 8);
          assert.equal(receipt.node.checksum, 33);
          assert.equal(receipt.wasmtime.status, 'passed');
          assert.equal(receipt.wasmtime.goldenCases, 8);
          const bytes = Buffer.from(receipt.wasm64, 'base64');
          assert.ok(bytes.length >= 8 && bytes.length <= 65536);
          assert.equal(bytes.toString('base64'), receipt.wasm64);
          assert.equal(bytes.length, receipt.artifact.bytes);
          assert.equal(createHash('sha256').update(bytes).digest('hex'), receipt.artifact.sha256);
          assert.match(receipt.source.sha256, /^[a-f0-9]{64}$/);
          fs.appendFileSync(outputFile, [
            'wasm64=' + receipt.wasm64,
            'wasm_sha256=' + receipt.artifact.sha256,
            'source_sha256=' + receipt.source.sha256,
            '',
          ].join('\n'));
          console.log('PASS Linux native compiled Wasm and independent goldens ' + receipt.artifact.sha256);
          NODE

  rebuild-native:
    name: Independently rebuild and compare on ${{ matrix.platform }}
    needs: produce-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-2025
            node_arch: x64
            os: Windows
            arch: X64
            js_os: win32
            js_arch: x64
            rust_host: x86_64-pc-windows-msvc
            cli: ./target/debug/grunkalunka.exe
          - platform: Apple Silicon macOS ARM64
            runner: macos-15
            node_arch: arm64
            os: macOS
            arch: ARM64
            js_os: darwin
            js_arch: arm64
            rust_host: aarch64-apple-darwin
            cli: ./target/debug/grunkalunka
    steps:
      - name: Check out same workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native Node.js 24.22.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          architecture: ${{ matrix.node_arch }}
          package-manager-cache: false

      - name: Assert native host and build maintained Rust compiler
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_RUST_HOST: ${{ matrix.rust_host }}
          EXPECTED_JS_OS: ${{ matrix.js_os }}
          EXPECTED_JS_ARCH: ${{ matrix.js_arch }}
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = "$EXPECTED_OS"
          test "$RUNNER_ARCH" = "$EXPECTED_ARCH"
          node -e "if (process.platform !== process.env.EXPECTED_JS_OS || process.arch !== process.env.EXPECTED_JS_ARCH || process.version !== 'v24.22.1') process.exit(1)"
          if [ "$RUNNER_OS" = macOS ]; then
            test "$(uname -m)" = arm64
            test "$(sysctl -n sysctl.proc_translated 2>/dev/null || printf '0')" = 0
          fi
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f 1)"
          rustup toolchain install "$toolchain" --profile minimal
          rustc -vV | tee "$RUNNER_TEMP/native-rustc-version.txt"
          grep -F "host: $EXPECTED_RUST_HOST" "$RUNNER_TEMP/native-rustc-version.txt"
          cargo fetch --locked
          cargo build --locked --offline -p grunkalunka-cli -j 4

      - name: Check negative identity cases on native host
        run: node --test tests/build/native-build-identity.test.mjs

      - name: Recompile canonical Git bytes and compare exact emitted Wasm
        env:
          EXPECTED_WASM64: ${{ needs.produce-linux.outputs.wasm64 }}
          EXPECTED_WASM_SHA256: ${{ needs.produce-linux.outputs.wasm_sha256 }}
          EXPECTED_SOURCE_SHA256: ${{ needs.produce-linux.outputs.source_sha256 }}
          EXPECTED_JS_OS: ${{ matrix.js_os }}
          EXPECTED_JS_ARCH: ${{ matrix.js_arch }}
        run: |
          set -euo pipefail
          node tools/bench/native-build-identity.mjs verify ${{ matrix.cli }} \
            > "$RUNNER_TEMP/native-build-receipt.json"
          node --input-type=commonjs - "$RUNNER_TEMP/native-build-receipt.json" <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const receipt = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          assert.equal(receipt.schemaVersion, 1);
          assert.equal(receipt.workload, 'p1-native-gcd-output-identity');
          assert.equal(receipt.mode, 'verify');
          assert.equal(receipt.host.os, process.env.EXPECTED_JS_OS);
          assert.equal(receipt.host.arch, process.env.EXPECTED_JS_ARCH);
          assert.equal(receipt.host.node, 'v24.22.1');
          assert.equal(receipt.source.sha256, process.env.EXPECTED_SOURCE_SHA256);
          assert.equal(receipt.artifact.sha256, process.env.EXPECTED_WASM_SHA256);
          assert.equal(receipt.node.goldenCases, 8);
          assert.equal(receipt.node.checksum, 33);
          assert.equal(receipt.wasmtime.status, 'passed');
          assert.equal(receipt.wasmtime.goldenCases, 8);
          assert.ok(!Object.hasOwn(receipt, 'wasm64'));
          console.log('PASS independent native build produced identical GCD Wasm SHA-256 ' + receipt.artifact.sha256);
          console.log(JSON.stringify(receipt));
          NODE
