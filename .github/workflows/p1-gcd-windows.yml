# Optional P1 cross-OS replay; existing canonical and ARM64 workflows are unchanged.
name: P1 portable GCD Linux to Windows

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/p1-gcd-windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-gcd-windows-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  prepare-linux:
    name: Produce and validate GCD Wasm on Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      wasm64: ${{ steps.transfer.outputs.wasm64 }}
      manifest64: ${{ steps.transfer.outputs.manifest64 }}
      sha256: ${{ steps.transfer.outputs.sha256 }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install fixed native Node x64
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          architecture: x64
          package-manager-cache: false

      - name: Build native compiler and Wasmtime CLI
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          test "$RUNNER_ARCH" = X64
          node -e "if (process.platform !== 'linux' || process.arch !== 'x64' || process.version !== 'v24.22.1') process.exit(1)"
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f 1)"
          rustup toolchain install "$toolchain" --profile minimal
          rustc -vV
          cargo fetch --locked
          cargo build --locked --offline -p grunkalunka-cli -j 4

      - name: Compile GCD once and validate independent fixed goldens
        run: |
          set -euo pipefail
          ./target/debug/grunkalunka compile examples/numeric-workflow/gcd.js "$RUNNER_TEMP/gcd.wasm"
          node tools/bench/portable-gcd.mjs prepare "$RUNNER_TEMP/gcd.wasm" --build-label ci-linux-x64 \
            > "$RUNNER_TEMP/manifest.json"
          node tools/bench/portable-gcd.mjs replay "$RUNNER_TEMP/gcd.wasm" "$RUNNER_TEMP/manifest.json" \
            --runner ./target/debug/grunkalunka --samples 2 --iterations 3 --warmup 0 \
            > "$RUNNER_TEMP/producer.json"

      - name: Transfer bounded artifact and manifest as ephemeral outputs
        id: transfer
        run: |
          set -euo pipefail
          node --input-type=commonjs - "$RUNNER_TEMP/gcd.wasm" "$RUNNER_TEMP/manifest.json" "$RUNNER_TEMP/producer.json" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const { createHash } = require('node:crypto');
          const [wasmFile, manifestFile, reportFile, outputFile] = process.argv.slice(2);
          const wasm = fs.readFileSync(wasmFile);
          const manifestBytes = fs.readFileSync(manifestFile);
          const manifest = JSON.parse(manifestBytes.toString('utf8'));
          const report = JSON.parse(fs.readFileSync(reportFile, 'utf8'));
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          assert.ok(wasm.length >= 8 && wasm.length <= 65536, 'bounded Wasm output');
          assert.ok(manifestBytes.length > 0 && manifestBytes.length <= 16384, 'bounded manifest output');
          assert.equal(manifest.artifact.sha256, hash(wasm));
          assert.equal(manifest.artifact.bytes, wasm.length);
          assert.deepEqual([manifest.origin.os, manifest.origin.arch], ['linux', 'x64']);
          assert.equal(report.artifact.sha256, hash(wasm));
          assert.equal(report.node.goldenCases, 8);
          assert.equal(report.wasmtime.status, 'passed');
          assert.equal(report.wasmtime.goldenCases, 8);
          fs.appendFileSync(outputFile, [
            'wasm64=' + wasm.toString('base64'),
            'manifest64=' + manifestBytes.toString('base64'),
            'sha256=' + hash(wasm),
            '',
          ].join('\n'));
          console.log('PASS Linux x64 source and Wasmtime/Node goldens; SHA-256 ' + hash(wasm));
          NODE

  replay-windows:
    name: Replay identical Linux GCD Wasm on Windows x64
    needs: prepare-linux
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out same workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install same native Node version on Windows
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          architecture: x64
          package-manager-cache: false

      - name: Build native Windows Wasmtime host only
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Windows
          test "$RUNNER_ARCH" = X64
          node -e "if (process.platform !== 'win32' || process.arch !== 'x64' || process.version !== 'v24.22.1') process.exit(1)"
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f 1)"
          rustup toolchain install "$toolchain" --profile minimal
          rustc -vV
          cargo fetch --locked
          cargo build --locked --offline -p grunkalunka-cli -j 4

      - name: Restore exact Linux bytes and verify producer provenance
        env:
          TRANSFER_WASM64: ${{ needs.prepare-linux.outputs.wasm64 }}
          TRANSFER_MANIFEST64: ${{ needs.prepare-linux.outputs.manifest64 }}
          TRANSFER_SHA256: ${{ needs.prepare-linux.outputs.sha256 }}
        run: |
          set -euo pipefail
          node --input-type=commonjs - "$RUNNER_TEMP/gcd.wasm" "$RUNNER_TEMP/manifest.json" <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const { createHash } = require('node:crypto');
          const [wasmFile, manifestFile] = process.argv.slice(2);
          const { TRANSFER_WASM64: encoded, TRANSFER_MANIFEST64: encodedManifest,
            TRANSFER_SHA256: expected } = process.env;
          assert.match(encoded ?? '', /^[A-Za-z0-9+/]+={0,2}$/);
          assert.match(encodedManifest ?? '', /^[A-Za-z0-9+/]+={0,2}$/);
          assert.match(expected ?? '', /^[a-f0-9]{64}$/);
          const wasm = Buffer.from(encoded, 'base64');
          const manifestBytes = Buffer.from(encodedManifest, 'base64');
          assert.ok(wasm.length >= 8 && wasm.length <= 65536, 'bounded artifact transfer');
          assert.ok(manifestBytes.length > 0 && manifestBytes.length <= 16384, 'bounded manifest transfer');
          assert.equal(wasm.toString('base64'), encoded, 'canonical Wasm transfer');
          assert.equal(manifestBytes.toString('base64'), encodedManifest, 'canonical manifest transfer');
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          const manifest = JSON.parse(manifestBytes.toString('utf8'));
          assert.equal(hash(wasm), expected);
          assert.equal(manifest.artifact.sha256, expected);
          assert.equal(manifest.artifact.bytes, wasm.length);
          assert.deepEqual([manifest.origin.os, manifest.origin.arch], ['linux', 'x64']);
          assert.equal(manifest.source.path, 'examples/numeric-workflow/gcd.js');
          // Windows checkout may apply core.autocrlf; hash the tracked Git blob instead.
          const { execFileSync } = require('node:child_process');
          const trackedSource = execFileSync('git', ['show', 'HEAD:' + manifest.source.path], {
            windowsHide: true, timeout: 5000, maxBuffer: 16384,
          });
          assert.equal(trackedSource.length, manifest.source.bytes);
          assert.equal(hash(trackedSource), manifest.source.sha256);
          fs.writeFileSync(wasmFile, wasm, { flag: 'wx' });
          fs.writeFileSync(manifestFile, manifestBytes, { flag: 'wx' });
          console.log('PASS Linux-origin GCD bytes restored on Windows x64 SHA-256 ' + expected);
          NODE

      - name: Verify unchanged bytes and all goldens in native Windows engines
        env:
          TRANSFER_SHA256: ${{ needs.prepare-linux.outputs.sha256 }}
        run: |
          set -euo pipefail
          node tools/bench/portable-gcd.mjs replay "$RUNNER_TEMP/gcd.wasm" "$RUNNER_TEMP/manifest.json" \
            --runner ./target/debug/grunkalunka.exe --samples 2 --iterations 3 --warmup 0 \
            > "$RUNNER_TEMP/receiver.json"
          node --input-type=commonjs - "$RUNNER_TEMP/receiver.json" <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          assert.equal(report.artifact.sha256, process.env.TRANSFER_SHA256);
          assert.equal(report.node.artifact.sha256, process.env.TRANSFER_SHA256);
          assert.deepEqual([report.original.origin.os, report.original.origin.arch], ['linux', 'x64']);
          assert.deepEqual([report.receiver.os, report.receiver.arch], ['win32', 'x64']);
          assert.equal(report.node.environment.os, 'win32');
          assert.equal(report.node.environment.arch, 'x64');
          assert.equal(report.node.environment.node, 'v24.22.1');
          assert.equal(report.node.goldenCases, 8);
          assert.equal(report.node.checksum, 33);
          assert.equal(report.wasmtime.status, 'passed');
          assert.equal(report.wasmtime.goldenCases, 8);
          assert.match(report.wasmtime.nativeRunnerSha256, /^[a-f0-9]{64}$/);
          console.log('PASS cross-OS identical-artifact Linux -> Windows GCD replay');
          console.log(JSON.stringify(report));
          NODE
