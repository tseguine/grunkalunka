# P1 experimental generated rustc metadata substitution using one fixed
# native wrapper executable on each host. Canonical CI is unchanged.
name: P1 native Cargo generated metadata override

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/p1-native-cargo-metadata-override.yml
      - tools/bench/native-cargo-metadata-override.mjs
      - tools/bench/tests/native-cargo-metadata-override.test.mjs
      - tools/bench/fixtures/p1-native-cargo-metadata-wrapper.rs
      - tools/bench/wasm-section-fingerprint.mjs
      - crates/grunkalunka-markdown/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-native-metadata-override-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  producer:
    name: Compile default and normalized Rust metadata guests on Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    outputs:
      receipt64: ${{ steps.transfer.outputs.receipt64 }}
    steps:
      - name: Check out exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact native Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          architecture: x64
          package-manager-cache: false

      - name: Verify Linux host and install wasm32 Rust target
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
          node -e "if (process.platform !== 'linux' || process.arch !== 'x64' || process.version !== 'v24.21.0') process.exit(1)"
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f 1)"
          rustup toolchain install "$toolchain" --profile minimal --target wasm32-unknown-unknown
          rustc -vV | tee "$RUNNER_TEMP/rustc-native.txt"
          grep -F 'host: x86_64-unknown-linux-gnu' "$RUNNER_TEMP/rustc-native.txt"
          cargo fetch --locked

      - name: Verify exact metadata controls and fail-closed regression cases
        run: node --test tools/bench/tests/native-cargo-metadata-override.test.mjs

      - name: Compile actual Rust wrapper and three independent Markdown guest variants
        id: transfer
        run: |
          set -euo pipefail
          node tools/bench/native-cargo-metadata-override.mjs collect \
            > "$RUNNER_TEMP/linux-cargo-override.json"
          node --input-type=commonjs - "$RUNNER_TEMP/linux-cargo-override.json" "$GITHUB_OUTPUT" <<'NODE'
          const fs=require('node:fs');
          const zlib=require('node:zlib');
          const assert=require('node:assert/strict');
          const [path,output]=process.argv.slice(2);
          const bytes=fs.readFileSync(path);
          assert.ok(bytes.length>0&&bytes.length<=768*1024,'bounded native receipt');
          const data=JSON.parse(bytes.toString('utf8'));
          assert.equal(data.workload,'p1-native-cargo-metadata-override');
          assert.deepEqual([data.environment.os,data.environment.arch],['linux','x64']);
          assert.equal(data.environment.node,'v24.21.0');
          assert.deepEqual(Object.keys(data.variants).sort(),['all','passthrough','target','target_plus_deps']);
          const modes={};
          for(const [name,mode] of Object.entries(data.variants)){
            assert.ok(mode.actualMetadata.length>=7&&mode.actualMetadata.length<=128);
            const selected=['bitflags','build_script_build','grunkalunka_markdown',
              'memchr','outline_guest','pulldown_cmark','unicase'];
            assert.deepEqual(mode.actualMetadata
              .filter(x=>selected.includes(x.crate))
              .map(x=>x.crate).sort(),selected);
            assert.ok(mode.actualMetadata
              .filter(x=>!selected.includes(x.crate)).every(x=>!x.changed));
            assert.ok(mode.report.codeBodies.count>=1&&mode.report.codeBodies.count<=4096);
            assert.match(mode.report.artifact.sha256,/^[a-f0-9]{64}$/);
            modes[name]={
              artifact:mode.report.artifact,
              crateMetadata:mode.actualMetadata.map(x=>({
                crate:x.crate,original:x.original,effective:x.effective,changed:x.changed,
              })),
            };
          }
          const compressed=zlib.gzipSync(bytes,{level:9});
          assert.ok(compressed.length>0&&compressed.length<=384*1024);
          const encoded=compressed.toString('base64');
          assert.ok(encoded.length<=535*1024,'bounded job output');
          fs.appendFileSync(output,'receipt64='+encoded+'\n');
          console.log('PASS real native Linux Cargo metadata wrapper controls');
          console.log(JSON.stringify(modes));
          NODE

  native-compare:
    name: Compare actual normalized metadata Wasm on ${{ matrix.platform }}
    needs: producer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-2025
            runner_os: Windows
            runner_arch: X64
            node_os: win32
            node_arch: x64
            rust_host: x86_64-pc-windows-msvc
          - platform: Apple Silicon macOS ARM64
            runner: macos-15
            runner_os: macOS
            runner_arch: ARM64
            node_os: darwin
            node_arch: arm64
            rust_host: aarch64-apple-darwin
    steps:
      - name: Check out same tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install identical native Node.js version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          architecture: ${{ matrix.node_arch }}
          package-manager-cache: false

      - name: Verify native OS and Rust release before compiling
        env:
          EXPECTED_OS: ${{ matrix.runner_os }}
          EXPECTED_ARCH: ${{ matrix.runner_arch }}
          EXPECTED_NODE_OS: ${{ matrix.node_os }}
          EXPECTED_NODE_ARCH: ${{ matrix.node_arch }}
          EXPECTED_RUST_HOST: ${{ matrix.rust_host }}
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = "$EXPECTED_OS"
          test "$RUNNER_ARCH" = "$EXPECTED_ARCH"
          node -e "if (process.platform !== process.env.EXPECTED_NODE_OS || process.arch !== process.env.EXPECTED_NODE_ARCH || process.version !== 'v24.21.0') process.exit(1)"
          if [ "$RUNNER_OS" = macOS ]; then
            test "$(uname -m)" = arm64
            test "$(sysctl -n sysctl.proc_translated 2>/dev/null || printf '0')" = 0
          fi
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f 1)"
          rustup toolchain install "$toolchain" --profile minimal --target wasm32-unknown-unknown
          rustc -vV | tee "$RUNNER_TEMP/native-rustc.txt"
          grep -F "host: $EXPECTED_RUST_HOST" "$RUNNER_TEMP/native-rustc.txt"
          cargo fetch --locked

      - name: Verify comparison source and metadata rejection behavior
        run: node --test tools/bench/tests/native-cargo-metadata-override.test.mjs

      - name: Compile three modes with same native rustc wrapper and compare with Linux
        env:
          PRODUCER_RECEIPT64: ${{ needs.producer.outputs.receipt64 }}
          EXPECTED_NODE_OS: ${{ matrix.node_os }}
          EXPECTED_NODE_ARCH: ${{ matrix.node_arch }}
          EXPECTED_RUST_HOST: ${{ matrix.rust_host }}
        run: |
          set -euo pipefail
          node --input-type=commonjs - "$RUNNER_TEMP/linux-cargo-override.json" <<'NODE'
          const fs=require('node:fs');
          const zlib=require('node:zlib');
          const assert=require('node:assert/strict');
          const encoded=process.env.PRODUCER_RECEIPT64??'';
          assert.match(encoded,/^[A-Za-z0-9+/]+={0,2}$/);
          assert.ok(encoded.length>0&&encoded.length<=535*1024);
          const compressed=Buffer.from(encoded,'base64');
          assert.ok(compressed.length>0&&compressed.length<=384*1024);
          assert.equal(compressed.toString('base64'),encoded);
          const bytes=zlib.gunzipSync(compressed,{maxOutputLength:768*1024});
          assert.ok(bytes.length>0&&bytes.length<=768*1024);
          fs.writeFileSync(process.argv[2],bytes,{flag:'wx'});
          NODE
          node tools/bench/native-cargo-metadata-override.mjs collect \
            > "$RUNNER_TEMP/native-cargo-override.json"
          node tools/bench/native-cargo-metadata-override.mjs compare \
            "$RUNNER_TEMP/linux-cargo-override.json" "$RUNNER_TEMP/native-cargo-override.json" \
            > "$RUNNER_TEMP/native-cargo-comparison.json"
          node --input-type=commonjs - "$RUNNER_TEMP/native-cargo-comparison.json" <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const result=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          assert.equal(result.schemaVersion,1);
          assert.equal(result.workload,'p1-native-cargo-metadata-override-comparison');
          assert.deepEqual([result.producer.os,result.producer.arch],['linux','x64']);
          assert.equal(result.receiver.os,process.env.EXPECTED_NODE_OS);
          assert.equal(result.receiver.arch,process.env.EXPECTED_NODE_ARCH);
          assert.equal(result.receiver.rustcHost,process.env.EXPECTED_RUST_HOST);
          assert.equal(result.producer.rustc,result.receiver.rustc);
          assert.equal(result.producer.rustcCommit,result.receiver.rustcCommit);
          assert.equal(result.producer.llvm,result.receiver.llvm);
          assert.deepEqual(Object.keys(result.crossHost).sort(),
            ['all','passthrough','target','target_plus_deps']);
          for(const mode of ['passthrough','target','target_plus_deps','all']){
            const actual=result.metadata[mode];
            assert.equal(actual.totalCrates,5);
            assert.equal(actual.extraTotalCrates,2);
            assert.ok(actual.generatedSame>=0&&actual.generatedSame<=5);
            assert.ok(actual.effectiveSame>=0&&actual.effectiveSame<=5);
            assert.ok(actual.extraGeneratedSame>=0&&actual.extraGeneratedSame<=2);
            assert.ok(actual.extraEffectiveSame>=0&&actual.extraEffectiveSame<=2);
            const compared=result.crossHost[mode];
            assert.equal(typeof compared.sameArtifactBytes,'boolean');
            assert.ok(compared.matchingIgnoringOrder>=0);
            assert.ok(compared.matchingIgnoringOrder<=Math.min(...compared.functions));
            assert.match(result.artifacts.producer[mode].sha256,/^[a-f0-9]{64}$/);
            assert.match(result.artifacts.receiver[mode].sha256,/^[a-f0-9]{64}$/);
          }
          // Differences remain measured observations, never match thresholds.
          console.log('PASS native Cargo-generated metadata causal control');
          console.log(JSON.stringify(result));
          NODE
