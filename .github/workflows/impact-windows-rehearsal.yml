name: Windows partial-PR candidate rehearsal

on:
  pull_request:
    branches: [master]
    paths:
      - 'ci/impact/windows-pr-gate.mjs'
      - 'ci/impact/windows-pr-gate.test.mjs'
      - 'ci/impact/windows-rehearsal.mjs'
      - '.github/workflows/impact-windows-rehearsal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearsal:
    name: Real scoped Windows Cargo and impact checks (advisory)
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install Rust host toolchain with formatting and Clippy
        run: |
          node -e 'require("node:assert/strict").equal(process.version, "v24.21.0")'
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f 1)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: impact-windows-candidate
          workspaces: |
            . -> target
          cache-bin: 'false'
          save-if: 'false'
      - name: Prepare locked offline dependencies
        run: cargo fetch --locked
      - name: Validate general Windows gate fail-safe policy
        run: node --test ci/impact/windows-pr-gate.test.mjs
      - name: Execute actual Windows scoped build Clippy and tests
        run: node ci/impact/windows-rehearsal.mjs
