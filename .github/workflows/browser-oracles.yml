name: Browser oracles

on:
  pull_request:
    branches: [master]
    paths:
      - 'tests/browser-oracles/**'
      - 'tools/browser-oracles/**'
      - 'docs/browser-oracle-comparison.md'
      - '.github/workflows/browser-oracles.yml'
  push:
    branches: [master]
    paths:
      - 'tests/browser-oracles/**'
      - 'tools/browser-oracles/**'
      - 'docs/browser-oracle-comparison.md'
      - '.github/workflows/browser-oracles.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparator:
    name: Oracle schema and comparator
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run offline oracle contract tests
        run: node --test tests/browser-oracles/*.test.mjs
