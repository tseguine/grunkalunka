# Optional P1 affine correctness experiment, independent of required CI.
name: P1 portable affine x64 to ARM64

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/p1-affine-arm64.yml
      - examples/numeric-workflow/affine.js
      - tools/bench/verify-portable-affine.mjs
      - tests/build/portable-affine.test.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-affine-arm64-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  prepare-x64:
    name: Produce and verify affine Wasm on Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      wasm64: ${{ steps.transfer.outputs.wasm64 }}
      sha256: ${{ steps.transfer.outputs.sha256 }}
      source_sha256: ${{ steps.transfer.outputs.source_sha256 }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install fixed native Node.js x64
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          architecture: x64
          package-manager-cache: false

      - name: Build maintained numeric compiler and Wasmtime host
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          test "$RUNNER_ARCH" = "X64"
          node -e "if (process.arch !== 'x64' || process.version !== 'v24.22.1') process.exit(1)"
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f 1)"
          rustup toolchain install "$toolchain" --profile minimal
          rustc -vV
          cargo fetch --locked
          cargo build --locked --offline -p grunkalunka-cli -j 4

      - name: Compile one artifact and check both native engines
        run: |
          set -euo pipefail
          node --test tests/build/portable-affine.test.mjs
          ./target/debug/grunkalunka compile examples/numeric-workflow/affine.js "$RUNNER_TEMP/affine.wasm"
          node tools/bench/verify-portable-affine.mjs "$RUNNER_TEMP/affine.wasm" \
            --runner ./target/debug/grunkalunka > "$RUNNER_TEMP/producer.json"
          cat "$RUNNER_TEMP/producer.json"

      - name: Transfer bounded canonical bytes via job outputs
        id: transfer
        run: |
          set -euo pipefail
          node --input-type=commonjs - "$RUNNER_TEMP/affine.wasm" "$RUNNER_TEMP/producer.json" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const { createHash } = require('node:crypto');
          const [wasmFile, reportFile, outputFile] = process.argv.slice(2);
          const wasm = fs.readFileSync(wasmFile);
          const report = JSON.parse(fs.readFileSync(reportFile, 'utf8'));
          assert.ok(wasm.length >= 8 && wasm.length <= 65536, 'bounded producer artifact');
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          assert.equal(report.artifact.sha256, hash(wasm));
          assert.equal(report.artifact.bytes, wasm.length);
          assert.equal(report.artifact.imports, 0);
          assert.equal(report.node.goldenCases, 12);
          assert.equal(report.wasmtime.goldenCases, 12);
          assert.deepEqual(report.receiver, { os: 'linux', arch: 'x64' });
          fs.appendFileSync(outputFile, [
            'wasm64=' + wasm.toString('base64'),
            'sha256=' + hash(wasm),
            'source_sha256=' + hash(fs.readFileSync('examples/numeric-workflow/affine.js')),
            '',
          ].join('\n'));
          console.log('PASS x64 affine artifact SHA-256 ' + hash(wasm));
          NODE

  replay-arm64:
    name: Replay exactly the x64 affine Wasm on Linux ARM64
    runs-on: ubuntu-24.04-arm
    needs: prepare-x64
    timeout-minutes: 45
    steps:
      - name: Check out same source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install fixed native Node.js ARM64
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          architecture: arm64
          package-manager-cache: false

      - name: Build only native ARM64 Wasmtime host, not affine source
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$RUNNER_ARCH" = "ARM64"
          node -e "if (process.arch !== 'arm64' || process.version !== 'v24.22.1') process.exit(1)"
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f 1)"
          rustup toolchain install "$toolchain" --profile minimal
          rustc -vV | tee "$RUNNER_TEMP/rustc-version.txt"
          grep -F "host: aarch64-unknown-linux-gnu" "$RUNNER_TEMP/rustc-version.txt"
          cargo fetch --locked
          cargo build --locked --offline -p grunkalunka-cli -j 4

      - name: Verify source identity and restore exact x64-produced Wasm bytes
        env:
          TRANSFER_WASM64: ${{ needs.prepare-x64.outputs.wasm64 }}
          TRANSFER_SHA256: ${{ needs.prepare-x64.outputs.sha256 }}
          TRANSFER_SOURCE_SHA256: ${{ needs.prepare-x64.outputs.source_sha256 }}
        run: |
          set -euo pipefail
          node --input-type=commonjs - "$RUNNER_TEMP/affine.wasm" <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const { createHash } = require('node:crypto');
          const { TRANSFER_WASM64: encoded, TRANSFER_SHA256: expected,
            TRANSFER_SOURCE_SHA256: expectedSource } = process.env;
          assert.match(encoded ?? '', /^[A-Za-z0-9+/]+={0,2}$/);
          assert.match(expected ?? '', /^[a-f0-9]{64}$/);
          assert.match(expectedSource ?? '', /^[a-f0-9]{64}$/);
          const wasm = Buffer.from(encoded, 'base64');
          assert.ok(wasm.length >= 8 && wasm.length <= 65536, 'bounded transfer');
          assert.equal(wasm.toString('base64'), encoded, 'canonical complete transfer');
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          assert.equal(hash(wasm), expected, 'exact producer byte identity');
          assert.equal(hash(fs.readFileSync('examples/numeric-workflow/affine.js')), expectedSource);
          fs.writeFileSync(process.argv[2], wasm, { flag: 'wx' });
          console.log('PASS exact x64 affine artifact on ARM64 SHA-256 ' + expected);
          NODE

      - name: Replay native ARM64 Node/V8 and Wasmtime fixed binary64 cases
        env:
          TRANSFER_SHA256: ${{ needs.prepare-x64.outputs.sha256 }}
        run: |
          set -euo pipefail
          node --test tests/build/portable-affine.test.mjs
          node tools/bench/verify-portable-affine.mjs "$RUNNER_TEMP/affine.wasm" \
            --runner ./target/debug/grunkalunka > "$RUNNER_TEMP/receiver.json"
          node --input-type=commonjs - "$RUNNER_TEMP/receiver.json" <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          assert.deepEqual(report.receiver, { os: 'linux', arch: 'arm64' });
          assert.equal(report.artifact.sha256, process.env.TRANSFER_SHA256);
          assert.equal(report.artifact.imports, 0);
          assert.equal(report.node.node, 'v24.22.1');
          assert.equal(report.node.goldenCases, 12);
          assert.equal(report.wasmtime.goldenCases, 12);
          console.log('PASS same-byte cross-architecture affine binary64 goldens');
          console.log(JSON.stringify(report));
          NODE
