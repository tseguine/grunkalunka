name: Temporary Windows stack diagnosis

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: stack-diagnosis-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare toolchain and dependencies
        run: |
          rustup toolchain install stable --profile minimal
          cargo fetch --locked
      - name: Instrument only the disposable diagnostic checkout
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          function patch(path, replacements) {
            let text = fs.readFileSync(path, 'utf8');
            for (const [from, to] of replacements) {
              if (!text.includes(from)) throw new Error(`Missing diagnostic anchor: ${path}: ${from}`);
              text = text.replace(from, to);
            }
            fs.writeFileSync(path, text);
          }
          patch('crates/grunkalunka-compiler/src/lib.rs', [
            ['    let parsed = Parser::new', '    eprintln!("STACK-PHASE parse");\n    let parsed = Parser::new'],
            ['    let built = SemanticBuilder', '    eprintln!("STACK-PHASE semantics");\n    let built = SemanticBuilder'],
            ['    let callback_parameters = lower::infer_callback_parameters', '    eprintln!("STACK-PHASE callbacks");\n    let callback_parameters = lower::infer_callback_parameters'],
            ['    let general_bindings =', '    eprintln!("STACK-PHASE storage");\n    let general_bindings ='],
            ['        let completion = lowering.sequence', '        eprintln!("STACK-PHASE statements");\n        let completion = lowering.sequence'],
            ['        local_count = lowering.local_count;', '        eprintln!("STACK-PHASE statements-complete");\n        local_count = lowering.local_count;'],
            ['    let wat = emit::emit(&module)?;', '    eprintln!("STACK-PHASE emit");\n    let wat = emit::emit(&module)?;\n    eprintln!("STACK-PHASE encode");'],
            ['    Ok(Artifact { wat, wasm })', '    eprintln!("STACK-PHASE drop-module");\n    drop(module);\n    eprintln!("STACK-PHASE complete");\n    Ok(Artifact { wat, wasm })'],
          ]);
          patch('crates/grunkalunka-compiler/src/lower.rs', [
            ['        let outer = std::mem::replace(&mut self.statement_depth, depth);', '        eprintln!("STACK-STATEMENT {depth}");\n        let outer = std::mem::replace(&mut self.statement_depth, depth);'],
          ]);
          NODE
      - name: Build the instrumented CLI
        run: cargo build --locked --offline -p grunkalunka-cli -j 4
      - name: Observe the existing admitted boundary through the main-thread CLI
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {spawnSync} from 'node:child_process';
          import {numericForPrograms} from './tests/compatibility/numeric-for.mjs';
          const row = numericForPrograms.find(([id]) => id === 'for-source-depth-budget');
          if (!row) throw new Error('Missing original fixture');
          const source = 'target/stack-diagnosis.js';
          fs.writeFileSync(source, 'export function run(a,b) { ' + row[1] + ' }');
          const result = spawnSync('target/debug/grunkalunka.exe', ['wat', source], {
            encoding: 'utf8', timeout: 30000, maxBuffer: 16 * 1024 * 1024,
          });
          console.log(result.stderr);
          console.log(JSON.stringify({status: result.status, signal: result.signal, error: result.error?.message}));
          if (result.error) throw result.error;
          if (result.status === 0) console.log('Instrumented fixture completed; instrumentation can change stack layout.');
          else if (!result.stderr.includes('overflowed its stack')) throw new Error('Unexpected diagnostic failure');
          NODE
