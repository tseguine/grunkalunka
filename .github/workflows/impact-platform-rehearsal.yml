name: Cross-platform partial-PR execution rehearsal

on:
  # Diagnostic control: explicitly replay a known partial selection when needed.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearsal:
    name: Scoped PR gate (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    # Rehearse the same bounded profile used by production PR gates.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
          - platform: Windows
            runner: windows-2025
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up exactly pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install repo Rust toolchain and test components
        run: |
          node -e 'require("node:assert/strict").equal(process.version, "v24.21.0")'
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f 1)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Restore optional Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: pr-impact-scoped-${{ matrix.platform }}
          workspaces: |
            . -> target
          cache-bin: 'false'
          save-if: 'false'
      - name: Fetch locked workspace dependencies
        run: cargo fetch --locked
      - name: Check impact planner and executor fail-closed tests
        run: node --test ci/impact/*.test.mjs
      - name: Execute real scoped layout build, format, Clippy and tests
        run: node ci/impact/platform-rehearsal.mjs
