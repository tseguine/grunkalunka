# P1 diagnostic; correlate Rust function-name identities with raw Wasm bodies.
name: P1 Markdown named Wasm body correlation

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/p1-markdown-named-bodies.yml
      - tools/bench/wasm-named-bodies.mjs
      - tools/bench/tests/wasm-named-bodies.test.mjs
      - crates/grunkalunka-markdown/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-markdown-named-bodies-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  producer:
    name: Fingerprint Markdown function names and bodies on Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      receipt64: ${{ steps.transfer.outputs.receipt64 }}
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned native Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          architecture: x64
          package-manager-cache: false

      - name: Build unchanged guest with native Rust wasm32 compiler
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          node -e "if (process.platform !== 'linux' || process.arch !== 'x64' || process.version !== 'v24.21.0') process.exit(1)"
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f 1)"
          rustup toolchain install "$toolchain" --profile minimal --target wasm32-unknown-unknown
          rustc -vV
          cargo fetch --locked
          cargo build --locked --offline -j 4 -p grunkalunka-markdown \
            --example outline_guest --target wasm32-unknown-unknown

      - name: Validate name-map parser and send bounded Linux fingerprint
        id: transfer
        run: |
          set -euo pipefail
          node --test tools/bench/tests/wasm-named-bodies.test.mjs
          node tools/bench/wasm-named-bodies.mjs inspect \
            target/wasm32-unknown-unknown/debug/examples/outline_guest.wasm \
            > "$RUNNER_TEMP/linux-named-bodies.json"
          node --input-type=commonjs - "$RUNNER_TEMP/linux-named-bodies.json" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const [reportFile, outputFile] = process.argv.slice(2);
          const bytes = fs.readFileSync(reportFile);
          assert.ok(bytes.length > 0 && bytes.length <= 384 * 1024);
          const report = JSON.parse(bytes.toString('utf8'));
          assert.equal(report.workload, 'p1-markdown-guest-wasm-sections');
          assert.deepEqual([report.environment.os, report.environment.arch], ['linux', 'x64']);
          assert.equal(report.codeBodies.count, report.namedBodies.count);
          assert.ok(report.namedBodies.mappedCount > 0);
          assert.equal(report.namedBodies.mappedCount + report.namedBodies.missingCount,
            report.namedBodies.count);
          fs.appendFileSync(outputFile, 'receipt64=' + bytes.toString('base64') + '\n');
          console.log('PASS Linux Markdown names/body provenance ' +
            JSON.stringify({artifact:report.artifact,functions:report.namedBodies.count,
              namesPresent:report.namedBodies.mappedCount}));
          NODE

  compare:
    name: Compare Markdown named bodies on ${{ matrix.platform }}
    needs: producer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-2025
            os: Windows
            arch: X64
            js_os: win32
            js_arch: x64
            rust_host: x86_64-pc-windows-msvc
          - platform: Apple Silicon macOS ARM64
            runner: macos-15
            os: macOS
            arch: ARM64
            js_os: darwin
            js_arch: arm64
            rust_host: aarch64-apple-darwin
    steps:
      - name: Check out same revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install same pinned native Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          architecture: ${{ matrix.js_arch }}
          package-manager-cache: false

      - name: Verify native architecture and independently compile Markdown guest
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_JS_OS: ${{ matrix.js_os }}
          EXPECTED_JS_ARCH: ${{ matrix.js_arch }}
          EXPECTED_RUST_HOST: ${{ matrix.rust_host }}
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = "$EXPECTED_OS"
          test "$RUNNER_ARCH" = "$EXPECTED_ARCH"
          node -e "if (process.platform !== process.env.EXPECTED_JS_OS || process.arch !== process.env.EXPECTED_JS_ARCH || process.version !== 'v24.21.0') process.exit(1)"
          if [ "$RUNNER_OS" = macOS ]; then
            test "$(uname -m)" = arm64
            test "$(sysctl -n sysctl.proc_translated 2>/dev/null || printf '0')" = 0
          fi
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f 1)"
          rustup toolchain install "$toolchain" --profile minimal --target wasm32-unknown-unknown
          rustc -vV | tee "$RUNNER_TEMP/rustc-host.txt"
          grep -F "host: $EXPECTED_RUST_HOST" "$RUNNER_TEMP/rustc-host.txt"
          cargo fetch --locked
          cargo build --locked --offline -j 4 -p grunkalunka-markdown \
            --example outline_guest --target wasm32-unknown-unknown

      - name: Compare raw named-function occurrences against Linux
        env:
          PRODUCER_RECEIPT64: ${{ needs.producer.outputs.receipt64 }}
          EXPECTED_JS_OS: ${{ matrix.js_os }}
          EXPECTED_JS_ARCH: ${{ matrix.js_arch }}
        run: |
          set -euo pipefail
          node --test tools/bench/tests/wasm-named-bodies.test.mjs
          node --input-type=commonjs - "$RUNNER_TEMP/linux-named-bodies.json" <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const encoded = process.env.PRODUCER_RECEIPT64 ?? '';
          assert.match(encoded, /^[A-Za-z0-9+/]+={0,2}$/, 'canonical bounded transfer');
          const bytes = Buffer.from(encoded, 'base64');
          assert.ok(bytes.length > 0 && bytes.length <= 384 * 1024);
          assert.equal(bytes.toString('base64'), encoded);
          fs.writeFileSync(process.argv[2], bytes, { flag: 'wx' });
          NODE
          node tools/bench/wasm-named-bodies.mjs inspect \
            target/wasm32-unknown-unknown/debug/examples/outline_guest.wasm \
            > "$RUNNER_TEMP/native-named-bodies.json"
          node tools/bench/wasm-named-bodies.mjs compare \
            "$RUNNER_TEMP/linux-named-bodies.json" "$RUNNER_TEMP/native-named-bodies.json" \
            > "$RUNNER_TEMP/named-body-comparison.json"
          node --input-type=commonjs - "$RUNNER_TEMP/named-body-comparison.json" <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          assert.equal(report.schemaVersion, 1);
          assert.equal(report.workload, 'p1-markdown-named-body-comparison');
          assert.deepEqual([report.producer.os, report.producer.arch], ['linux', 'x64']);
          assert.equal(report.receiver.os, process.env.EXPECTED_JS_OS);
          assert.equal(report.receiver.arch, process.env.EXPECTED_JS_ARCH);
          assert.equal(report.producer.rustc, report.receiver.rustc,
            'same observed Rust compiler release');
          assert.ok(report.producer.namesPresent > 0 &&
            report.producer.namesPresent <= report.producer.functions);
          assert.ok(report.receiver.namesPresent > 0 &&
            report.receiver.namesPresent <= report.receiver.functions);
          assert.ok(report.sharedNameAndExactBodyOccurrences <= report.sharedNameOccurrences);
          assert.ok(report.sharedNameOccurrences <=
            Math.min(report.producer.namesPresent, report.receiver.namesPresent));
          assert.equal(report.sharedNameOccurrencesWithoutExactBodyMatch +
            report.sharedNameAndExactBodyOccurrences, report.sharedNameOccurrences);
          console.log('PASS native Markdown named-function raw body comparison');
          console.log(JSON.stringify(report));
          NODE
