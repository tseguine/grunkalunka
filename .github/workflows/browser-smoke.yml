name: Browser engine smoke

on:
  pull_request:
    branches: [master]
    paths: ['tests/browser-oracles/**', 'tools/browser-oracles/**', '.github/workflows/browser-smoke.yml']
  push:
    branches: [master]
    paths: ['tests/browser-oracles/**', 'tools/browser-oracles/**', '.github/workflows/browser-smoke.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Real ${{ matrix.engine }} observations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test the independent receipt verifier offline
        run: node --test tools/browser-oracles/verify-baseline.test.mjs
      - name: Install isolated optional automation dependency
        run: npm --prefix tools/browser-oracles install --ignore-scripts --no-audit --no-fund
      - name: Install the selected managed browser and system dependencies
        run: node tools/browser-oracles/node_modules/playwright/cli.js install --with-deps ${{ matrix.engine }}
      - name: Record font and host inventory
        run: |
          mkdir -p target/browser-smoke/${{ matrix.engine }}
          fc-list | LC_ALL=C sort > target/browser-smoke/${{ matrix.engine }}/fonts.txt
          uname -a > target/browser-smoke/${{ matrix.engine }}/host.txt
          cat /etc/os-release >> target/browser-smoke/${{ matrix.engine }}/host.txt
      - name: Capture, verify and mutation-test real browser observations
        run: timeout --kill-after=10s 240s node tools/browser-oracles/smoke.mjs ${{ matrix.engine }} target/browser-smoke/${{ matrix.engine }}/captures
      - name: Retain raw evidence and resolved dependency inventory
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: browser-smoke-${{ matrix.engine }}
          path: |
            target/browser-smoke/${{ matrix.engine }}/
            tools/browser-oracles/package-lock.json
            tools/browser-oracles/node_modules/playwright-core/browsers.json
          if-no-files-found: error
          retention-days: 7

  cross-engine:
    name: Cross-engine evidence report
    needs: smoke
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Download this run's separate engine artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: browser-smoke-*
          path: target/browser-cross-engine/input
          merge-multiple: false
      - name: Report source-checked differences without a majority-vote oracle
        if: ${{ !cancelled() }}
        run: |
          mkdir -p target/browser-cross-engine
          root=target/browser-cross-engine/input
          status=0
          timeout --kill-after=5s 30s node tests/browser-oracles/cross-engine.mjs \
            tests/browser-oracles/layout-baseline.html \
            "$root/browser-smoke-chromium/target/browser-smoke/chromium/captures/first.json" \
            "$root/browser-smoke-firefox/target/browser-smoke/firefox/captures/first.json" \
            "$root/browser-smoke-webkit/target/browser-smoke/webkit/captures/first.json" \
            > target/browser-cross-engine/report.json || status=$?
          # 1 means complete comparable evidence with differences, not nonconformance.
          # Missing, invalid, incompatible inputs and execution errors must fail.
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then exit "$status"; fi
      - name: Retain complete or partial cross-engine evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: browser-cross-engine
          path: target/browser-cross-engine/report.json
          if-no-files-found: error
          retention-days: 7
