name: Browser engine smoke

on:
  pull_request:
    branches: [master]
    paths:
      - '.gitattributes'
      - '.github/workflows/browser-smoke.yml'
      - 'tests/browser-oracles/cascade-mutations.html'
      - 'tests/browser-oracles/compare.mjs'
      - 'tests/browser-oracles/cross-engine.mjs'
      - 'tests/browser-oracles/event-dispatch.html'
      - 'tests/browser-oracles/flex-mutations.html'
      - 'tests/browser-oracles/flex-wrap-lines.html'
      - 'tests/browser-oracles/grid-placement.html'
      - 'tests/browser-oracles/layout-baseline.html'
      - 'tests/browser-oracles/listener-lifecycle.html'
      - 'tests/browser-oracles/shadow-events.html'
      - 'tools/browser-oracles/cascade.mjs'
      - 'tools/browser-oracles/collect.mjs'
      - 'tools/browser-oracles/diagnostic-isolation.mjs'
      - 'tools/browser-oracles/events.mjs'
      - 'tools/browser-oracles/flex.mjs'
      - 'tools/browser-oracles/flex-wrap-lines.mjs'
      - 'tools/browser-oracles/grid-placement.mjs'
      - 'tools/browser-oracles/hosted/cross-engine.test.mjs'
      - 'tools/browser-oracles/hosted/smoke.test.mjs'
      - 'tools/browser-oracles/listener-lifecycle.mjs'
      - 'tools/browser-oracles/package.json'
      - 'tools/browser-oracles/shadow-events.mjs'
      - 'tools/browser-oracles/smoke.mjs'
      - 'tools/browser-oracles/verify-baseline.mjs'
  push:
    branches: [master]
    paths:
      - '.gitattributes'
      - '.github/workflows/browser-smoke.yml'
      - 'tests/browser-oracles/cascade-mutations.html'
      - 'tests/browser-oracles/compare.mjs'
      - 'tests/browser-oracles/cross-engine.mjs'
      - 'tests/browser-oracles/event-dispatch.html'
      - 'tests/browser-oracles/flex-mutations.html'
      - 'tests/browser-oracles/flex-wrap-lines.html'
      - 'tests/browser-oracles/grid-placement.html'
      - 'tests/browser-oracles/layout-baseline.html'
      - 'tests/browser-oracles/listener-lifecycle.html'
      - 'tests/browser-oracles/shadow-events.html'
      - 'tools/browser-oracles/cascade.mjs'
      - 'tools/browser-oracles/collect.mjs'
      - 'tools/browser-oracles/diagnostic-isolation.mjs'
      - 'tools/browser-oracles/events.mjs'
      - 'tools/browser-oracles/flex.mjs'
      - 'tools/browser-oracles/flex-wrap-lines.mjs'
      - 'tools/browser-oracles/grid-placement.mjs'
      - 'tools/browser-oracles/hosted/cross-engine.test.mjs'
      - 'tools/browser-oracles/hosted/smoke.test.mjs'
      - 'tools/browser-oracles/listener-lifecycle.mjs'
      - 'tools/browser-oracles/package.json'
      - 'tools/browser-oracles/shadow-events.mjs'
      - 'tools/browser-oracles/smoke.mjs'
      - 'tools/browser-oracles/verify-baseline.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # A floating major can select different cached versions in different jobs.
  BROWSER_NODE_VERSION: '24.21.0'

jobs:
  smoke:
    name: Real ${{ matrix.engine }} observations
    runs-on: ubuntu-24.04
    # Official Playwright image includes all three managed engines and their OS deps.
    # Avoid variable Ubuntu apt mirrors on every new hosted runner.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.BROWSER_NODE_VERSION }}
          package-manager-cache: false
      - name: Install isolated optional automation dependency
        run: npm --prefix tools/browser-oracles install --ignore-scripts --no-audit --no-fund
      - name: Record font and host inventory
        run: |
          mkdir -p target/browser-smoke/${{ matrix.engine }}
          fc-list | LC_ALL=C sort > target/browser-smoke/${{ matrix.engine }}/fonts.txt
          uname -a > target/browser-smoke/${{ matrix.engine }}/host.txt
          cat /etc/os-release >> target/browser-smoke/${{ matrix.engine }}/host.txt
      - name: Run real reference-engine behavior as node:test
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
          BROWSER_EVIDENCE_DIR: target/browser-smoke/${{ matrix.engine }}/captures
        run: timeout --kill-after=10s 250s node --test tools/browser-oracles/hosted/smoke.test.mjs
      - name: Retain raw evidence and resolved dependency inventory
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: browser-smoke-${{ matrix.engine }}
          path: |
            target/browser-smoke/${{ matrix.engine }}/
            tools/browser-oracles/package-lock.json
            tools/browser-oracles/node_modules/playwright-core/browsers.json
          if-no-files-found: error
          retention-days: 7

  cross-engine:
    name: Cross-engine evidence report
    needs: smoke
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.BROWSER_NODE_VERSION }}
          package-manager-cache: false
      - name: Download this run's separate engine artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: browser-smoke-*
          path: target/browser-cross-engine/input
          merge-multiple: false
      - name: Source-check real three-engine receipts as node:test
        if: ${{ !cancelled() }}
        env:
          BROWSER_CROSS_ENGINE_INPUT: target/browser-cross-engine/input
          BROWSER_CROSS_ENGINE_OUTPUT: target/browser-cross-engine
        run: node --test tools/browser-oracles/hosted/cross-engine.test.mjs
      - name: Retain complete or partial cross-engine evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: browser-cross-engine
          path: target/browser-cross-engine/report.json
          if-no-files-found: error
          retention-days: 7
