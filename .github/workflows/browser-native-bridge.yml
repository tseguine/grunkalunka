name: Native block-box versus real browser observations

on:
  pull_request:
    branches: [master]
    paths:
      - 'crates/grunkalunka-layout/**'
      - 'tests/browser-oracles/native-block-bridge.html'
      - 'tests/browser-oracles/native-block-bridge.mjs'
      - 'tests/browser-oracles/native-block-bridge.test.mjs'
      - 'tests/browser-oracles/native-block-bridge-workflow.test.mjs'
      - 'tests/browser-oracles/compare.mjs'
      - 'tools/browser-oracles/collect.mjs'
      - 'tools/browser-oracles/native-bridge-sensitivity.mjs'
      - 'tools/browser-oracles/native-bridge-sensitivity.test.mjs'
      - 'tools/browser-oracles/native-hit-sensitivity.mjs'
      - 'tools/browser-oracles/native-hit-sensitivity.test.mjs'
      - 'tools/browser-oracles/native-height-sensitivity.mjs'
      - 'tools/browser-oracles/native-height-sensitivity.test.mjs'
      - 'tools/browser-oracles/hosted/native-bridge.test.mjs'
      - 'tools/browser-oracles/package.json'
      - '.github/workflows/browser-native-bridge.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  push:
    branches: [master]
    paths:
      - 'crates/grunkalunka-layout/**'
      - 'tests/browser-oracles/native-block-bridge.html'
      - 'tests/browser-oracles/native-block-bridge.mjs'
      - 'tests/browser-oracles/native-block-bridge.test.mjs'
      - 'tests/browser-oracles/native-block-bridge-workflow.test.mjs'
      - 'tests/browser-oracles/compare.mjs'
      - 'tools/browser-oracles/collect.mjs'
      - 'tools/browser-oracles/native-bridge-sensitivity.mjs'
      - 'tools/browser-oracles/native-bridge-sensitivity.test.mjs'
      - 'tools/browser-oracles/native-hit-sensitivity.mjs'
      - 'tools/browser-oracles/native-hit-sensitivity.test.mjs'
      - 'tools/browser-oracles/native-height-sensitivity.mjs'
      - 'tools/browser-oracles/native-height-sensitivity.test.mjs'
      - 'tools/browser-oracles/hosted/native-bridge.test.mjs'
      - 'tools/browser-oracles/package.json'
      - '.github/workflows/browser-native-bridge.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Build independent Grunkalunka box geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the repository Rust toolchain
        run: |
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f 1)"
          rustup toolchain install "$toolchain" --profile minimal
      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: browser-native-bridge
          workspaces: |
            . -> target
          cache-bin: 'false'
          save-if: 'false'
      - name: Compile and run the real headless layout example
        run: |
          cargo fetch --locked
          mkdir -p target/native-bridge
          cargo run --locked --offline -p grunkalunka-layout --example native_block_bridge > target/native-bridge/native.json
          python3 -m json.tool target/native-bridge/native.json > /dev/null
      - name: Retain exact native geometry from this revision
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: native-block-bridge
          path: target/native-bridge/native.json
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Compare native boxes against ${{ matrix.engine }}
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Download this exact run's native geometry receipt
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: native-block-bridge
          path: target/native-bridge
      - name: Install isolated pinned reference-engine automation
        run: npm --prefix tools/browser-oracles install --ignore-scripts --no-audit --no-fund
      - name: Run native/browser parity and negative controls as node:test
        env:
          BROWSER_NODE_VERSION: '24.21.0'
          BROWSER_ENGINE: ${{ matrix.engine }}
          BROWSER_BRIDGE_NATIVE: target/native-bridge/native.json
          BROWSER_BRIDGE_OUTPUT: target/native-bridge/${{ matrix.engine }}
        run: node --test tools/browser-oracles/hosted/native-bridge.test.mjs
      - name: Retain original native, HTML, browser and comparison evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: native-bridge-${{ matrix.engine }}
          path: |
            target/native-bridge/native.json
            target/native-bridge/${{ matrix.engine }}/
          if-no-files-found: warn
          retention-days: 7
