# P1 independent Cargo JSON build-script output-tree identity control.
name: P1 native Cargo build-script output identity

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/p1-native-cargo-build-script.yml
      - tools/bench/native-cargo-build-script.mjs
      - tools/bench/tests/native-cargo-build-script.test.mjs
      - crates/grunkalunka-markdown/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-cargo-build-script-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  producer:
    name: Inventory actual Linux x64 Cargo build-script outputs
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      receipt64: ${{ steps.transfer.outputs.receipt64 }}
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up fixed native Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          architecture: x64
          package-manager-cache: false

      - name: Validate native Linux and install active Rust wasm32 target
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
          node -e "if (process.platform !== 'linux' || process.arch !== 'x64' || process.version !== 'v24.21.0') process.exit(1)"
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f 1)"
          rustup toolchain install "$toolchain" --profile minimal --target wasm32-unknown-unknown
          rustc -vV
          cargo fetch --locked

      - name: Test structured Cargo JSON receipt and malformed-input rejection
        run: node --test tools/bench/tests/native-cargo-build-script.test.mjs

      - name: Build real Markdown guest and hash generated output trees
        id: transfer
        run: |
          set -euo pipefail
          node tools/bench/native-cargo-build-script.mjs collect \
            > "$RUNNER_TEMP/linux-build-scripts.json"
          node --input-type=commonjs - "$RUNNER_TEMP/linux-build-scripts.json" "$GITHUB_OUTPUT" <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const [filename,output]=process.argv.slice(2);
          const bytes=fs.readFileSync(filename);
          assert.ok(bytes.length>0&&bytes.length<=192*1024);
          const report=JSON.parse(bytes.toString('utf8'));
          assert.equal(report.workload,'p1-native-cargo-build-script-outputs');
          assert.deepEqual([report.environment.os,report.environment.arch],['linux','x64']);
          assert.equal(report.environment.node,'v24.21.0');
          assert.ok(report.scripts.length>=1&&report.scripts.length<=16);
          assert.match(report.guest.sha256,/^[a-f0-9]{64}$/);
          const encoded=bytes.toString('base64');
          assert.ok(encoded.length<=260*1024);
          fs.appendFileSync(output,'receipt64='+encoded+'\n');
          console.log('PASS Linux native Cargo build-script output inventory '+
            JSON.stringify({guest:report.guest,scripts:report.scripts.map(x=>({
              package:x.package,generatedFiles:x.files.length,generatedBytes:x.totalBytes,
              cfgs:x.cfgHashes.length,env:x.env.map(y=>y.key),
            }))}));
          NODE

  receivers:
    name: Compare real Cargo build-script outputs on ${{ matrix.platform }}
    needs: producer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-2025
            runner_os: Windows
            runner_arch: X64
            node_os: win32
            node_arch: x64
            rust_host: x86_64-pc-windows-msvc
          - platform: Apple Silicon macOS ARM64
            runner: macos-15
            runner_os: macOS
            runner_arch: ARM64
            node_os: darwin
            node_arch: arm64
            rust_host: aarch64-apple-darwin
    steps:
      - name: Checkout same exact Git revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install matching native Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          architecture: ${{ matrix.node_arch }}
          package-manager-cache: false

      - name: Verify native OS, architecture and Rust compiler host
        env:
          EXPECTED_OS: ${{ matrix.runner_os }}
          EXPECTED_ARCH: ${{ matrix.runner_arch }}
          EXPECTED_NODE_OS: ${{ matrix.node_os }}
          EXPECTED_NODE_ARCH: ${{ matrix.node_arch }}
          EXPECTED_RUST_HOST: ${{ matrix.rust_host }}
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = "$EXPECTED_OS"
          test "$RUNNER_ARCH" = "$EXPECTED_ARCH"
          node -e "if (process.platform !== process.env.EXPECTED_NODE_OS || process.arch !== process.env.EXPECTED_NODE_ARCH || process.version !== 'v24.21.0') process.exit(1)"
          if [ "$RUNNER_OS" = macOS ]; then
            test "$(uname -m)" = arm64
            test "$(sysctl -n sysctl.proc_translated 2>/dev/null || printf '0')" = 0
          fi
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f 1)"
          rustup toolchain install "$toolchain" --profile minimal --target wasm32-unknown-unknown
          rustc -vV | tee "$RUNNER_TEMP/native-rustc.txt"
          grep -F "host: $EXPECTED_RUST_HOST" "$RUNNER_TEMP/native-rustc.txt"
          cargo fetch --locked

      - name: Test receipt validations on this native receiver
        run: node --test tools/bench/tests/native-cargo-build-script.test.mjs

      - name: Independently build and compare actual script-generated inputs
        env:
          LINUX_RECEIPT64: ${{ needs.producer.outputs.receipt64 }}
          EXPECTED_NODE_OS: ${{ matrix.node_os }}
          EXPECTED_NODE_ARCH: ${{ matrix.node_arch }}
          EXPECTED_RUST_HOST: ${{ matrix.rust_host }}
        run: |
          set -euo pipefail
          node --input-type=commonjs - "$RUNNER_TEMP/linux-build-scripts.json" <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const encoded=process.env.LINUX_RECEIPT64??'';
          assert.match(encoded,/^[A-Za-z0-9+/]+={0,2}$/);
          assert.ok(encoded.length>0&&encoded.length<=260*1024);
          const bytes=Buffer.from(encoded,'base64');
          assert.ok(bytes.length>0&&bytes.length<=192*1024);
          assert.equal(bytes.toString('base64'),encoded);
          fs.writeFileSync(process.argv[2],bytes,{flag:'wx'});
          NODE
          node tools/bench/native-cargo-build-script.mjs collect \
            > "$RUNNER_TEMP/native-build-scripts.json"
          node tools/bench/native-cargo-build-script.mjs compare \
            "$RUNNER_TEMP/linux-build-scripts.json" "$RUNNER_TEMP/native-build-scripts.json" \
            > "$RUNNER_TEMP/build-script-comparison.json"
          node --input-type=commonjs - "$RUNNER_TEMP/build-script-comparison.json" <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const report=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          assert.equal(report.schemaVersion,1);
          assert.equal(report.workload,'p1-native-cargo-build-script-comparison');
          assert.deepEqual([report.producer.os,report.producer.arch],['linux','x64']);
          assert.equal(report.receiver.os,process.env.EXPECTED_NODE_OS);
          assert.equal(report.receiver.arch,process.env.EXPECTED_NODE_ARCH);
          assert.equal(report.receiver.rustcHost,process.env.EXPECTED_RUST_HOST);
          assert.equal(report.producer.rustc,report.receiver.rustc);
          assert.equal(report.producer.rustcCommit,report.receiver.rustcCommit);
          assert.equal(report.producer.llvm,report.receiver.llvm);
          assert.ok(report.findings.length>=1&&report.findings.length<=32);
          for(const finding of report.findings){
            if(finding.missingOn)continue;
            assert.equal(typeof finding.sameGeneratedFiles,'boolean');
            assert.equal(typeof finding.sameCfgHashes,'boolean');
            assert.ok(finding.changedFiles.length<=1024);
          }
          // Differing build-script outputs are observed evidence, not failure.
          console.log('PASS independent Cargo build-script generated input comparison');
          console.log(JSON.stringify(report));
          NODE
