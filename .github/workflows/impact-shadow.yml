name: PR impact (advisory)

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  impact:
    name: Shadow PR impact plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tested PR revision and merge-base history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Verify the independent impact planner
        run: node --test ci/impact/impact.test.mjs
      - name: Report advisory impact without skipping canonical checks
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: node ci/impact/plan.mjs "origin/$BASE_BRANCH"
